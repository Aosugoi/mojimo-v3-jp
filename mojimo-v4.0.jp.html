  const go=buf=>{if(tok!==ttsTok||!buf)return;const src=c.createBufferSource(),g=c.createGain();g.gain.value=1;src.buffer=buf;if(vc)src.playbackRate.value=vc[1];src.connect(g);g.connect(c.destination);ttsSrc=src;try{Music.duck(buf.duration/(vc?vc[1]:1)+.3)}catch{}src.onended=()=>{if(ttsSrc===src)ttsSrc=null};src.start();o&&o.onStart&&o.onStart(buf.duration/(vc?vc[1]:1))};
  if(TTSBUF[url]instanceof AudioBuffer){go(TTSBUF[url]);return}
  (TTSBUF[url]||(TTSBUF[url]=getBuf(url).then(b=>new Promise((res,rej)=>c.decodeAudioData(b,res,rej))).then(b=>(TTSBUF[url]=b)).catch(()=>{delete TTSBUF[url];return null}))).then(b=>{if(b)go(b);else if(tok===ttsTok)playClipEl(url,vc,text,who,o,est)});
}
const getBuf=u=>{if(u.startsWith('data:')){try{const b=atob(u.slice(u.indexOf(',')+1)),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return Promise.resolve(a.buffer)}catch(e){return Promise.reject(e)}}return fetch(u).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})};
let clipEl=null;
function playClipEl(url,vc,text,who,o,est){try{const a=new Audio(url);clipEl=a;if(o&&o.onStart)a.addEventListener('playing',()=>o.onStart((isFinite(a.duration)?a.duration:est)/(vc?vc[1]:1)),{once:true});if(vc){a.preservesPitch=false;a.webkitPreservesPitch=false;a.playbackRate=vc[1]}a.play().catch(()=>{sayFallback(text,who);o&&o.onStart&&o.onStart(est||2)})}catch{sayFallback(text,who);o&&o.onStart&&o.onStart(est||2)}}
function ttsPreload(list,who){list.forEach(t=>{const u=ttsFile(t,who);if(u&&!TTSBUF[u]){const c=vctx();if(!c)return;TTSBUF[u]=getBuf(u).then(b=>new Promise((res,rej)=>c.decodeAudioData(b,res,rej))).then(b=>(TTSBUF[u]=b)).catch(()=>{delete TTSBUF[u];return null})}})}

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(v===false||v==null)continue;if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const k of kids)if(k!=null&&k!==false)e.append(k);return e}

const norm=s=>s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
/* kana/kanji answers: full-width -> normal, katakana -> hiragana, drop spaces and punctuation */
const normKana=s=>String(s||'').normalize('NFKC').replace(/[\u30A1-\u30F6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s\u3000、。・,.!?！？「」『』〜~]/g,'');
function recallOK(k,input){const it=I[k];if(!input)return false;
  if(it.r.some(r=>norm(r)===norm(input))&&norm(input))return true;
  const v=normKana(input);if(!v)return false;
  return v===normKana(k)||(!!it.w&&v===normKana(it.w))||(!!it.rd&&v===normKana(it.rd));}

,"+10% coins from every lesson":["レッスンごとに コイン+10%",null],"The fox of rice fields":["たんぼの きつね",null],"In Japan, foxes are messengers of Inari, the spirit of rice and good harvests. You can see fox statues at many shrines.":["日本では、きつねは おこめと ほうさくの かみさま「おいなりさん」の つかいです。たくさんの じんじゃで きつねの ぞうを 見ることが できます。",null],"Nine tails":["九本の しっぽ",null],"A kitsune grows a new tail every hundred years. When it has nine tails, it becomes very wise and can see far away.":["きつねは 百年ごとに しっぽが 一本ふえます。しっぽが 九本に なると、とても かしこくなり、とおくまで 見とおせるように なります。",null],"Foxfire":["きつね火",null],"On quiet nights, kitsune make tiny blue flames called kitsunebi. People said they looked like a line of lanterns in the dark.":["しずかな よる、きつねは「きつね火」という 小さな あおい 火を ともします。くらやみに ちょうちんが ならんでいるように 見えたそうです。",null],"+10% XP from every lesson":["レッスンごとに XP+10%",null],"Spirit of the mountains":["山の ようかい",null],"Tengu live deep in mountain forests. They have red faces, long noses or beaks, and wings like big birds.":["てんぐは 山の おくの もりに すんでいます。あかい かお、ながい はなや くちばし、大きな とりのような つばさを もっています。",null],"Master of training":["しゅぎょうの 名人",null],"Legends say tengu taught a young samurai named Ushiwakamaru how to fight and leap like the wind.":["でんせつでは、てんぐが わかい さむらい「うしわかまる」に、かぜのように たたかい とびまわる わざを おしえたと いわれています。",null],"The magic fan":["まほうの うちわ",null],"A tengu carries a feather fan. One wave makes a strong wind, so strong it can blow away whole trees!":["てんぐは はねの うちわを もっています。ひとふりで 木を まるごと ふきとばすほどの つよい かぜが おこります！",null],"+1 extra treat after every lesson":["レッスンのあと おやつが もう1こ",null],"River friend":["川の ともだち",null],"Kappa live in rivers and ponds. They have a turtle shell, webbed hands and a little dish of water on top of their head.":["かっぱは 川や いけに すんでいます。カメのような こうら、みずかきの ある 手、そして あたまの 上に 水の 入った おさらが あります。",null],"Keep the dish full":["おさらの 水を こぼさないで",null],"If a kappa bows, the water spills from its dish and it loses its strength. So always bow to a kappa, and it will bow back!":["かっぱが おじぎを すると、おさらの 水が こぼれて 力が なくなります。だから かっぱに 会ったら おじぎを しよう。かっぱも おじぎを かえしてくれますよ！",null],"Cucumber lover":["きゅうりが 大すき",null],"Kappa love cucumbers more than anything. That is why cucumber sushi rolls are called kappa-maki.":["かっぱは なによりも きゅうりが 大すき。だから きゅうりの おすしを「かっぱまき」と よぶのです。",null],"Combo shield: your first mistake in a lesson keeps your combo":["コンボガード：レッスンで さいしょに まちがえても コンボが つづく",null],"The big ogre":["大きな おに",null],"Oni are big, strong ogres with horns, wild hair and a heavy club. They can be red, blue or even yellow.":["おには つのと ぼさぼさの かみ、おもい かなぼうを もった 大きくて つよい ようかいです。あかおに、あおおに、きいろい おにも います。",null],"Bean throwing day":["まめまきの 日",null],"Every February on Setsubun, families throw roasted beans and shout \"Oni wa soto! Fuku wa uchi!\" Ogres out, luck in!":["まいとし 2月の せつぶんには、かぞくで いった まめを まいて「おには そと！ ふくは うち！」と さけびます。",null],"Kind oni":["やさしい おに",null],"Not every oni is scary. In the story \"The Red Oni Who Cried\", a gentle oni only wanted to be friends with people.":["おには こわいばかりでは ありません。おはなし「ないた あかおに」では、やさしい おにが 人間と ともだちに なりたいと ねがっていました。",null],"Double daily gift: 2 treats and 10 coins":["まいにちの プレゼントが 2ばい：おやつ2こと コイン10まい",null],"Dragon of the sky":["空の りゅう",null],"Japanese dragons have long snake bodies, no wings, and fly through the clouds. They are wise and very old.":["日本の りゅうは ヘビのように ながい からだで、つばさが なくても くもの 中を とびます。とても かしこくて、ながい ながい 時を 生きています。",null],"Rain bringer":["雨を よぶ りゅう",null],"Dragons control water. Farmers prayed to dragons for rain so their rice would grow.":["りゅうは 水を あやつります。お百しょうさんは おこめが そだつように、りゅうに 雨を おねがいしました。",null],"The dragon pearl":["りゅうの たま",null],"Many dragons hold a glowing pearl. It is said to grant wishes and hold the dragon's power.":["りゅうの 多くは ひかる たまを もっています。ねがいを かなえ、りゅうの 力が やどっていると いわれています。",null],"+1 Help power-up in every lesson":["レッスンごとに ヘルプが +1",null],"The waterfall weaver":["たきの はたおり",null],"Jorōgumo is a spider spirit said to live near waterfalls, weaving beautiful silk threads.":["じょろうぐもは たきの ちかくに すみ、うつくしい いとを おると いわれる くもの ようかいです。",null],"Golden silk":["きんいろの いと",null],"Real jorō spiders make huge golden webs. You can find them in Japanese gardens in autumn.":["ほんものの ジョロウグモは 大きな きんいろの すを つくります。あきの 日本の にわで 見つけられますよ。",null],"The lucky woodcutter":["うんの いい きこり",null],"In one tale, a woodcutter at a waterfall was saved because the spider's thread caught on a tree stump instead of him.":["ある おはなしでは、たきに いた きこりが、くもの いとが じぶんではなく 木の かぶに からまったおかげで たすかりました。",null],"+50% XP from review lessons":["ふくしゅうレッスンの XP+50%",null],"The snow lady":["ゆきの むすめ",null],"Yuki-onna appears on snowy nights in the mountains. Her skin is white as snow and her breath is icy cold.":["ゆきおんなは ゆきの ふる 山の よるに あらわれます。はだは ゆきのように 白く、いきは こおるように つめたいのです。",null],"Only at night":["よるだけ",null],"She is shy of the sun, so she only comes out after dark. Look for her when the moon is up!":["お日さまが にがてなので、くらくなってから しか 出てきません。月が 出たら さがしてみよう！",null],"A gentle promise":["やさしい やくそく",null],"In the famous story, Yuki-onna spared a young man and asked him to keep her secret forever.":["ゆうめいな おはなしでは、ゆきおんなは わかものを たすけ、ひみつを ずっと まもるように やくそくさせました。",null],"Capsule spins cost 25 coins instead of 30":["クレーンゲームが 30コインではなく 25コイン",null],"The two-tailed cat":["しっぽが 二本の ねこ",null],"When a cat lives a very long life, its tail splits in two and it becomes a nekomata.":["ねこが とても ながく 生きると、しっぽが 二つに わかれて「ねこまた」に なります。",null],"Little tricks":["ちいさな いたずら",null],"Nekomata love mischief. They can walk on two legs, dance with a towel on their head and even talk!":["ねこまたは いたずらが 大すき。二本足で あるいたり、あたまに てぬぐいを のせて おどったり、しゃべったりも します！",null],"Lucky cats":["まねきねこ",null],"The waving lucky cat, maneki-neko, comes from cat legends like these. It invites good luck and visitors.":["手を ふる「まねきねこ」は、こうした ねこの でんせつから 生まれました。しあわせと おきゃくさんを よんでくれます。",null],"Lucky meter: an egg is guaranteed within 8 spins instead of 10":["ラッキーメーター：10かいではなく 8かいいないに たまごが かならず 出る",null],"The phantom snake":["まぼろしの ヘビ",null],"Tsuchinoko is a chubby snake with a fat belly. Many people say they saw one, but no one has ever caught it.":["ツチノコは おなかが ぷっくり ふくらんだ ヘビです。見たという 人は たくさん いますが、つかまえた 人は いません。",null],"Rolling away":["ころころ にげる",null],"It can jump high and roll down hills like a wheel. It also loves sake and snores when it sleeps!":["高く とんだり、車りんのように さかを ころがったりします。おさけが すきで、ねるときは いびきを かくとか！",null],"Find it if you can":["見つけられるかな",null],"Some towns in Japan offer big prizes to anyone who finds a real tsuchinoko. Keep your eyes open!":["日本には、ほんものの ツチノコを 見つけた 人に 大きな しょうきんを 出す まちも あります。よく 見ていてね！",null],"Guards your streak: misses up to 2 days without breaking it":["れんぞくきろくを まもる：2日まで 休んでも とぎれない",null],"The invisible wall":["見えない かべ",null],"Late at night, travellers sometimes found an invisible wall blocking the road. That was a nurikabe!":["よるおそく、たびびとの 前に 見えない かべが あらわれて 道を ふさぐことが ありました。それが ぬりかべです！",null],"How to pass":["とおりぬける ほうほう",null],"If you tap the bottom of the wall with a stick, the nurikabe disappears. Tapping the top does nothing at all.":["ぼうで かべの 下の ほうを たたくと、ぬりかべは きえます。上の ほうを たたいても なにも おこりません。",null],"Steady protector":["たのもしい まもりがみ",null],"Nurikabe never moves and never gives up. It stands strong, like a friend who always has your back.":["ぬりかべは うごかず、けっして あきらめません。いつも そばで ささえてくれる ともだちのように、どっしり 立っています。",null],"Inari, the rice spirit":["おこめの かみさま",null],"feather, wing":["",null],"phantom, illusion":["",null],"plate, dish":["",null],"to search":["",null],"bean":["",null],"bell":["",null],"cloud":["",null],"cucumber":["",null],"dragon":["",null],"horn":["",null],"mountain":["",null],"night":["",null],"nose":["",null],"ogre":["",null],"rain":["",null],"river":["",null],"road":["",null],"snake":["",null],"snow":["",null],"spider":["",null],"stone":["",null],"tail":["",null],"thread":["",null],"wall":["",null],"waterfall":["",null],"winter":["",null],"fox":["","rubah"],"Sly":["ずるがしこい",null],"Proud":["ほこりたかい",null],"Playful":["あそびずき",null],"Fierce":["あらあらしい",null],"Majestic":["どうどうとした",null],"Mysterious":["なぞめいた",null],"Icy":["つめたい",null],"Mischievous":["いたずらずき",null],"Elusive":["つかまらない",null],"Steadfast":["ゆるがない",null],"pig":["",null],"chick":["",null],"hippo":[ es unlocked. Find them in Collection":["でんせつの いきもの 10ぴきを かいほう！コレクションで 見てね",null],"✦ Mythic ticket: your next spin is a mythical creature":["✦ でんせつチケット：つぎの 1かいは でんせつの いきもの",null],"Mythic quest done: you earned a Mythic ticket!":["でんせつクエスト たっせい：でんせつチケットを ゲット！",'Misi mitos selesai: kamu dapat tiket mitos!'],"Prototype tools are now hidden. Tap the version number at the bottom of the menu 10 times to show them, and 10 more times to hide them again":["テストようツールを かくしました。メニューの いちばん下の バージョンを 10かい タップすると 出て、もう10かいで また かくれます",null],"Ducks keep their feathers waterproof by spreading a natural oil over them while they preen.":["アヒルは はねを ととのえるとき、しぜんの あぶらを ぬって 水を はじくように しています。",null],"Some seals can hold their breath for more than an hour on a deep dive.":["アザラシの なかには 1時間いじょう いきを とめて もぐれる ものも います。",null],"Pigs hardly sweat, so they roll in mud to keep cool.":["ブタは ほとんど あせを かかないので、どろあびを して からだを ひやします。",null],"Eagles can spot a rabbit from about 3 km away.":["ワシは 3キロも はなれた ところの ウサギを 見つけられます。",null],"Owls can turn their heads about 270 degrees. In Japan, ふくろう can be written ふくろう, \"no hardship\", so owls are lucky charms.":["フクロウは くびを およそ270ど まわせます。「ふくろう」は「ふくろう（くろうしない）」とも 書けるので、えんぎものです。",null],"Gorillas build a fresh nest of leaves to sleep in every night.":["ゴリラは まいばん はっぱで あたらしい ベッドを つくって ねます。",null],"A hedgehog has around 5,000 to 7,000 spines, and curls into a spiky ball when it is scared.":["ハリネズミには はりが 5000〜7000本 あり、こわいと まるまって トゲトゲの ボールに なります。",null],"Sheep can remember the faces of about 50 other sheep for years.":["ヒツジは ほかの ヒツジ 50あたまくらいの かおを 何年も おぼえていられます。",null],"Chicks start peeping to their mother while they are still inside the egg.":["ヒヨコは たまごの 中に いるときから おかあさんに むかって ピヨピヨ なきはじめます。",null],"The boar (い) is one of the 12 animals of the Japanese zodiac.":["イノシシ（い）は 十二しの どうぶつの 一つです。",null],"Every dog has its own nose print, a bit like a human fingerprint.":["いぬの はなの もようは 1ぴきずつ ちがい、人の しもんのようです。",null],"Dolphins have their own signature whistles that work like names.":["イルカは 名前のように つかう じぶんだけの 口ぶえを もっています。",null],"Hippos can't really swim. They walk or bounce along the river bottom instead.":["カバは じつは およげません。川の そこを あるいたり はねたりして すすみます。",null],"In Japan turtles stand for long life: つるは千年、かめは万年, \"cranes live 1,000 years, turtles 10,000\".":["日本では カメは ながいきの しるし。「つるは千年、かめは万年」と いいます。",null],"Kangaroos find it hard to walk backwards, so they are always moving forward.":["カンガルーは うしろに あるくのが にがて。だから いつも 前に すすみます。",null],"In winter, capybaras in some Japanese zoos relax in warm yuzu baths.":["ふゆになると、日本の どうぶつえんでは カピバラが ゆずぶろに 入って くつろぎます。",null],"Sea otters hold hands while they sleep so they don't drift apart.":["ラッコは ねるとき、ながされないように 手を つないで ねます。",null],"Sloths climb down from their tree only about once a week.":["ナマケモノが 木から おりてくるのは 1週間に 1かいくらいです。",null],"なまけもの also means \"lazybones\" in Japanese. Sloths can hold their breath for up to 40 minutes.":["「なまけもの」には「のんびりや」という いみも あります。ナマケモノは 40分も いきを とめられます。",null],"The green pheasant (きじ) is Japan's national bird.":["キジは 日本の こくちょうです。",null],"A giraffe's tongue is about 45 cm long and dark purple-blue.":["キリンの したは 45センチほどで、こい むらさきいろを しています。",null],"In Japan, foxes are said to love fried tofu. That is why kitsune udon has it on top.":["日本では きつねは あぶらあげが すきだと いわれます。だから きつねうどんには あぶらあげが のっています。",null],"In Japanese stories, fox spirits are said to grow a new tail every hundred years.":["日本の むかしばなしでは、きつねの ようかいは 百年ごとに しっぽが ふえると いわれています。",null],"Koalas sleep up to 20 hours a day.":["コアラは 1日に 20時間も ねむります。",null],"A foal can stand and walk within an hour or two of being born.":["こうまは 生まれて 1〜2時間で 立って あるけるように なります。",null],"Blue whales are the largest animals that have ever lived.":["シロナガスクジラは これまでに いきていた どうぶつの 中で いちばん 大きい どうぶつです。",null],"Bears can smell food from kilometres away.":["クマは なんキロも はなれた たべものの においが わかります。",null],"Pandas spend about 12 hours a day eating bamboo.":["パンダは 1日に 12時間くらい ササを たべています。",null],"The maneki-neko, or lucky cat, raises its paw to welcome good fortune.":["まねきねこは 手を あげて しあわせを まねいています。",null],"The mouse (子) is the first animal of the Japanese zodiac.":["ネズミ（子）は 十二しの さいしょの どうぶつです。",null],"おおかみ is often linked to おおかみ, \"great god\". Wolves were once worshipped in Japan.":["「おおかみ」は「おおかみ」と むすびつけられ、むかしの 日本では かみさまとして まつられていました。",null],"Some penguins give a pebble as a gift to the one they like.":["ペンギンの なかには すきな あいてに こいしを プレゼントする ものも います。",null],"A lion's roar can be heard up to 8 km away.":["ライオンの ほえごえは 8キロ さきまで きこえます。",null],"Red pandas were called \"panda\" before giant pandas were.":["レッサーパンダは ジャイアントパンダより 先に「パンダ」と よばれていました。",null],"Squirrels bury nuts and forget some of them, which helps new trees grow.":["リスは どんぐりを うめて わすれることが あり、そこから あたらしい 木が そだちます。",null],"A rhino's horn is made of keratin, the same stuff as your hair and nails.":["サイの つのは、かみのけや つめと おなじ ケラチンで できています。",null],"Koi can live for decades. One famous koi in Japan was said to be over 200 years old.":["コイは 何十年も 生きます。日本には 200さいを こえたと いわれる コイも いました。",null],"Sharks never run out of teeth: new ones keep growing all their lives.":["サメの はは なくなりません。一生 あたらしい はが はえつづけます。",null],"Japanese macaques in Nagano warm up in hot springs in winter.":["ながのの ニホンザルは ふゆに おんせんに 入って あたたまります。",null],"In Nara, deer bow to people, especially when shika senbei crackers are around.":["ならの シカは 人に おじぎを します。とくに しかせんべいが あるときに！",null],"しろ means white. In Japan, white animals are thought to bring good luck.":["「しろ」は 白のこと。日本では 白い どうぶつは えんぎが いいと されています。",null],"An octopus has three hearts and blue blood.":["タコには しんぞうが 3つ あり、ちは あおい いろです。",null],"The crested ibis vanished from the wild in Japan and was brought back on Sado Island.":["トキは 日本の やせいから いなくなりましたが、さどがしまで また ふやされました。",null],"No two tigers have the same stripes.":["トラの しまもようは 1あたまずつ ぜんぶ ちがいます。",null],"とり means bird. The rooster (とり) is one of the 12 animals of the Japanese zodiac.":["「とり」は とりのこと。ニワトリ（とり）は 十二しの どうぶつの 一つです。",null],"うみ means sea. Japan has a holiday for the sea, うみの日, in July.":["「うみ」は うみのこと。日本には 7月に「うみの日」という しゅくじつが あります。",null],"Axolotls can regrow lost legs, and even parts of their heart.":["ウーパールーパーは なくした 足や、しんぞうの いちぶまで また はやすことが できます。",null],"In Japan, people say you can see a rabbit making mochi on the full moon.":["日本では、まんげつに ウサギが もちを ついているのが 見えると いいます。",null],"Cows have best friends and get stressed when they are apart.":["ウシにも 大のなかよしが いて、はなれると ストレスを かんじます。",null],"Elephants greet each other by twining their trunks together.":["ゾウは はなを からませて あいさつします。",null],"Your Mojimo now levels up all the way to Level 20 as it learns. At Level 5 you choose when it evolves: evolve right away, or tap the glowing Evolve button on Home any time later. Levels keep going after it evolves, and each level unlocks its abilities: speech quirk at Level 2, signature move at 3, favourite treat at 4, favourite place at 6, fun fact at 8, best-friend perk at 10, a doubled perk at 15 and a Master star at 20. Mythical powers start at Level 3":["もじもは べんきょうするたびに レベル20まで そだつように なりました。レベル5で しんかする タイミングを えらべます。すぐ しんかしても、あとで ホームの ひかる「しんか」ボタンから しんかしても OK。しんかの あとも レベルは 上がりつづけ、レベルごとに のうりょくが ふえます：レベル2で くちぐせ、3で とくいわざ、4で すきな おやつ、6で すきな ばしょ、8で まめちしき、10で なかよしボーナス、15で ボーナス2ばい、20で マスターの ほし。でんせつの ちからは レベル3から",null],"New prototype tools: Unlock everything (every character, form level, sticker, outfit, colour and backdrop), Level up companion, and an X to close the tools menu":["あたらしい テストようツール：すべて かいほう（キャラ・レベル・スタンプ・きせかえ・いろ・はいけい）、あいぼうを レベルアップ、ツールメニューを とじる ×ボタン",null],"When you tap the ground on Home, your Mojimo now turns and walks forward to that spot instead of walking backwards":["ホームで じめんを タップすると、もじもが うしろむきではなく そちらを むいて あるくように なりました",null],"New sticker button on Home and in the Hangout":["ホームと あそびばに あたらしい スタンプボタン",null],"New stickers! 58 Japanese sticker stamps replace the old emotes. Send one from the heart button and your Mojimo answers with a sticker of its own. More unlock as your friendship grows":["あたらしい スタンプ！58しゅるいの スタンプが ふるい エモートの かわりに なりました。ハートボタンから おくると、もじもも スタンプで こたえてくれます。なかよしに なるほど ふえていきます",null],"Every Mojimo now talks its own way: Inumaru ends its lines with わん, Nekorin with にゃん, Penmaru with ぺん, and so on, all in their own voice":["もじもが それぞれの しゃべりかたに なりました。いぬまるは「わん」、ねこりんは「にゃん」、ぺんまるは「ぺん」など、じぶんの こえで しゃべります",null],"Each Mojimo has a signature move on Home, like Inumaru chasing its tail, Penmaru belly-sliding or Kamemaru hiding in its shell":["もじもごとに ホームで とくいわざを します。いぬまるは しっぽを おいかけ、ぺんまるは おなかで すべり、かめまるは こうらに かくれます",null],"Favourite treats and places: feed a Mojimo its favourite for a big mood boost and a happy spin, and it hums on its favourite backdrop":["すきな おやつと ばしょ：すきな おやつを あげると とても ごきげんに なって くるっと まわり、すきな はいけいでは はなうたを うたいます",null],"New Mojimo notes: the animal's Japanese name with kanji, a fun fact, its catchphrase, habit and the favourites you have found":["あたらしい もじものノート：どうぶつの なまえと かんじ、まめちしき、くちぐせ、くせ、見つけた すきなもの",null],"Friend groups: collect all the Sea, Forest, Farm, Treetop or Safari friends to win a special backdrop":["なかまグループ：うみ・もり・ぼくじょう・きのうえ・サファリの なかまを ぜんいん あつめると とくべつな はいけいが もらえます",null],"Best-friend perks: at friendship level 5 your companion gives a small bonus, depending on its friend group":["なかよしボーナス：なかまグループに おうじて、あいぼうが ちいさな ボーナスを くれます",null],"Your first three eggs are now picked at random from all 50 Mojimo, so every player starts differently":["さいしょの 3つの たまごが 50ぴきの 中から ランダムに えらばれるように なりました",null],"New capsule machine: a crane game! Slide the claw and press GO. Plushies of friends you have not met yet sit inside, marked NEW, and the claw never misses":["あたらしい ガチャ：クレーンゲーム！アームを うごかして GO を おそう。まだ 会っていない なかまの ぬいぐるみに NEW マークが ついていて、アームは かならず つかみます",null],"Cleaner pictures for all 50 Mojimo: no more card edges, white specks or clipped tails on the grown, outfit and colour looks":["50ぴき ぜんいんの え を きれいに しました（カードの ふちや 白い てん、きれた しっぽを なおしました）",null],"Cleaner mythical creature pictures: no more cream halos, missing tails or odd cuts":["でんせつの いきものの え を きれいに しました",null],"10 mythical creatures in the capsule machine: Kitsune, Tengu, Kappa, Oni, Ryū, Jorōgumo, Yuki-onna, Nekomata, Tsuchinoko and Nurikabe, each with its own spirit-echo voice, golden aura and reveal":["ガチャに でんせつの いきもの 10ぴき：きつね・てんぐ・かっぱ・おに・りゅう・じょろうぐも・ゆきおんな・ねこまた・つちのこ・ぬりかべ。それぞれ ふしぎな こえと きんいろの オーラが あります",null],"New capsule prize: colours! Every Mojimo has a recoloured baby look with a matching sleeping look; switch with the new Colour option on the companion card":["あたらしい ガチャの けいひん：いろちがい！あいぼうカードの「いろ」で きりかえられます",null],"New \"Can't listen now\" button on listening questions: it swaps them for reading questions for 15 minutes, with no penalty":["リスニングもんだいに「いまは きけない」ボタン：15分間 よむもんだいに かわります",null],"Your Mojimo comes alive on Home: it wanders, looks around, stretches, sits, sniffs, wiggles, dozes, watches the scene and shivers in the rain, and its mood shows in how it moves":["ホームの もじもが いきいきと うごくように なりました。あるいたり、のびを したり、すわったり、うとうと したり、雨で ふるえたり します",null],"Rub your Mojimo to pet it, tap the ground to call it over, watch it munch treats, and try the new Play ball game":["なでて かわいがったり、じめんを タップして よんだり、おやつを たべる ようすを 見たり、ボールあそびも できます",null],"15 new backdrops: Mt. Fuji, Shrine gate, Castle, Koi pond, City sunset, Sunflower field, Lavender hills, Rainy garden, Country station, Sunset beach and Candy land in the Style shop, plus Lantern festival, Under the sea, Moon walk and Mushroom forest from capsules":["あたらしい はいけい 15しゅるい（スタイルの おみせと ガチャで）",null],"Fix: the Dance party button in Hangout is always visible, even with the tip showing on small phones":["しゅうせい：ちいさな スマホでも あそびばの ダンスパーティーボタンが 見えるように",null],"New Review screen: a summary of your words by mastery level, a clearer Review button, and tidier word cards; the explanation moved behind the ? button":["あたらしい ふくしゅうがめん：おぼえた レベルごとの まとめと 見やすい ボタン",null],"Flags on the language buttons in the menu":["メニューの ことばボタンに こっきを ついか",null],"Fix: the Home scene could get stuck scrolled halfway during the tutorial, hiding the name card and showing an empty pink area":["しゅうせい：チュートリアル中に ホームが とちゅうで とまる もんだい",null],"Shorter menu: Capsule machine, Hangout and Style as big buttons, language and Romaji, Music and Sound toggles on one screen":["メニューを みじかく しました",null],"Fixes: long names no longer get cut off on Home, tips stretch to the full width, and lessons fit better on small phones":["しゅうせい：ながい なまえが きれない、ちいさな スマホでも レッスンが 見やすく",null],"Removed the \"3–5 min\" lesson length from the Journey and the tips":["たびの「3〜5分」の ひょうじを なくしました",null],"New sticker-style icons for Feed, Play, Rest, Style and the Home, Journey, Review and Collection tabs":["あたらしい ステッカーふうの アイコン",null],};

    const place=()=>node.setAttribute('transform',`translate(${cx} ${headY+offY})`);place();
    if(prize.rar!=='c')node.classList.add('cr-glow'),node.style.setProperty('--gc',RARITY[prize.rar].col);
    await tween(700,t=>{headY=grabY+(CR.top+12-grabY)*t;setClaw();place()});
    const x1=cx;await tween(650,t=>{cx=x1+(CR.chuteX-x1)*t;setClaw();place()});
    await tween(200,t=>{open=0.15+t*0.85;setClaw()});
    const y0=headY+offY;await tween(420,t=>{node.setAttribute('transform',`translate(${cx} ${y0+(268-y0)*t}) scale(${1-t*0.35})`);node.style.opacity=1-t*0.6},t=>t*t);
    node.remove();const fl=svg.querySelector('.cr-flash');fl.style.transition='opacity .25s';fl.style.opacity='1';setTimeout(()=>fl.style.opacity='0',500);
    reveal(prize);
    // return claw and refresh the machine for the next round
    const x2=cx;await tween(500,t=>{cx=x2+(206-x2)*t;open=1-t*0.75;setClaw()});
    headY=CR.top;drawPity();busy=false;drawBtn();
    inner.classList.add('restock');setTimeout(()=>{build();inner.classList.remove('restock')},260)
  };
  spin.onclick=run;goBtn.onclick=run;
}


function checkQuests(){ // returns XP earned from newly completed quests
  let xp=0,lines=[];
  [['newWords',5,'Learn 5 new words'],['listen',1,'Listening challenge'],['review',5,'Review 5 old words']].forEach(([id,of,name])=>{

}

/* ================= HOME LIFE: wander, habits, moods, petting, ball ================= */
const Life=(()=>{
  const R=(a,b)=>a+Math.random()*(b-a);
  const ACTS=['life-stretch','life-sit','life-sniff','life-wiggle','life-lookup','life-doze','life-shiver','life-chomp','life-kick','walking',...SIG_CLS];
  let t=null,busy=false,px=0,face=1,lastTouch=Date.now(),lastId=null,gen=0;
  const zone=()=>$('petzone'),body=()=>$('petBody');
  const blocked=()=>Hide.on||current!=='home'||document.hidden||$('overlayHost').children.length>0||!S.active||stageOf(S.active)==='egg'||S.resting||!!document.querySelector('.tour')||introBusy;
  const range=()=>{const st=$('stage').clientWidth,pw=$('pet').offsetWidth||120;return Math.max(0,Math.min(st*.32,st/2-pw/2-22))};
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  function setFace(f){face=f;$('pet').style.setProperty('--face',-f)} /* art faces left, so flip to face right */
  function place(x,ms){const z=zone();z.style.setProperty('--wt',ms+'ms');z.style.setProperty('--px',x.toFixed(1)+'px');z.classList.toggle('onright',x>20);px=x}
  function walkTo(x,speed=55){const g=gen;return new Promise(res=>{const r=range();x=Math.max(-r,Math.min(r,x));const d=Math.abs(x-px);if(d<6){res();return}setFace(x>px?1:-1);const ms=d/speed*1000;place(x,ms);const b=body();b.classList.add('walking');setTimeout(()=>{if(g===gen)b.classList.remove('walking');res()},ms)})}
  function act(cls,ms){const b=body(),g=gen;b.classList.remove(...ACTS);void b.offsetWidth;b.classList.add(cls);return new Promise(r=>setTimeout(()=>{if(g===gen)b.classList.remove(cls);r()},ms))}
  function hop(){anim(body(),'anim-hop',560);return wait(560)}
  function night(){const sc=sceneOf(S.decor.wall||'bd-auto'),h=new Date().getHours();return !!sc.night||h>=21||h<6}
  function weather(){const sc=sceneOf(S.decor.wall||'bd-auto');return sc.fx==='rain'||sc.fx==='snow'}
  function mood(){const b=body();if(!b)return;b.classList.remove('mood-happy','mood-low','mood-sleepy');if(stageOf(S.active||'')==='egg'||S.resting)return;b.classList.add(night()?'mood-sleepy':S.mood>=70?'mood-happy':S.mood<35?'mood-low':'mood-ok')}
  const HABITS=[
    {w:()=>4,run:async()=>{await walkTo(R(-range(),range()));if(Math.random()<.4){await wait(400);setFace(-face);await wait(700);setFace(-face)}}},
    {w:()=>2,run:async()=>{setFace(-face);await wait(900);setFace(-face);await wait(500)}},
    {w:()=>2,run:async()=>{await act('life-stretch',1500);if(Math.random()<.4)emote($('petWrap'),rnd(['happy','tired']),1400)}},
    {w:()=>1.5,run:async()=>{await act('life-sit',2800)}},
    {w:()=>1.5,run:async()=>{if(Math.random()<.4)emote($('petWrap'),rnd(['question','thinking','hmm']),1500);await act('life-sniff',1700)}},
    {w:()=>S.mood>=60?2.5:1,run:async()=>{await act('life-wiggle',1000);if(Math.random()<.5)emote($('petWrap'),'dance',1400)}},
    {w:()=>(night()?4:0)+(Date.now()-lastTouch>90000?3:.4),run:async()=>{emote($('petWrap'),rnd(['sleepy','sleepy','snore']),2600);await act('life-doze',3400)}},
    {w:()=>(document.querySelector('#s-home .sc-deco g')?2.5:.5),run:async()=>{await act('life-lookup',1400);emote($('petWrap'),rnd(['excl','whoa','happy']),1300);if(Math.random()<.6){await walkTo(px+(Math.random()<.5?-1:1)*R(40,90),90);await hop()}}},
    {w:()=>weather()?3:0,run:async()=>{emote($('petWrap'),rnd(['unhappy','scared']),1300);await act('life-shiver',1300)}},
    {w:()=>S.mood<35?3:0,run:async()=>{emote($('petWrap'),rnd(['unhappy','pout','sigh','sob']),1500);await act('life-sit',2400)}},
    {w:()=>MYKEY[S.active]==='tsuchinoko'?1.6:0,run:async()=>{tsuchiHide()}},
    {w:()=>CM[S.active]&&hasAbil(S.active,'sig')?2.2:0,run:async()=>{await runSignature(act)}},
    {w:()=>{const c=CM[S.active];return c&&hasAbil(S.active,'fplace')&&(S.decor.wall||'bd-auto')===c.fb?(cmState(S.active).fb?2.5:6):0},run:async()=>{favHum();await wait(2600)}},
  ];
  async function behave(){
    if(blocked()||busy)return;busy=true;const g=gen;
    try{const ws=HABITS.map(h=>Math.max(0,h.w()));let r=Math.random()*ws.reduce((a,b)=>a+b,0);let h=HABITS[0];for(let i=0;i<HABITS.length;i++){r-=ws[i];if(r<=0){h=HABITS[i];break}}await h.run()}catch(e){}
    if(g===gen)busy=false;mood();
  }
  function loop(){clearTimeout(t);t=setTimeout(async()=>{await behave();loop()},R(6000,12000))}
  function reset(){gen++;busy=false;const z=zone();if(!z)return;place(0,0);setFace(-1);body().classList.remove(...ACTS)}
  let lastWall=null;
  function sync(){const id=S.active,egg=!id||stageOf(id)==='egg';if(id!==lastId||egg||S.resting){reset();lastId=id}mood();
    const w=S.decor.wall||'bd-auto';if(lastWall!==null&&w!==lastWall&&CM[id]&&CM[id].fb===w&&!egg&&!S.resting){const tryHum=(n)=>setTimeout(()=>{if($('overlayHost').children.length&&n<6)return tryHum(n+1);favHum()},1500);tryHum(0)}lastWall=w}
  /* ---- touch: petting + call-over ---- */
  let rub=null,suppress=0,lastPet=0;
  function petRect(){return $('pet').getBoundingClientRect()}
  function inPet(x,y,m=14){const r=petRect();return x>r.left-m&&x<r.right+m&&y>r.top-m&&y<r.bottom+m}
  function petted(){
    const id=S.active;lastTouch=Date.now();hearts(3);emote($('petWrap'),rnd(['blush','like','happy']),1400);act('life-wiggle',900);
    if(Date.now()-lastPet>3500){lastPet=Date.now();addFriend(id,1,'pet');S.mood=Math.min(100,S.mood+5);save();if(voiceNow)voiceNow.stop();talk(rnd(persona().tap),id)}
  }
  function bindTouch(){
    const st=$('stage');
    st.addEventListener('pointerdown',e=>{if(blocked()||busy&&!rub)return;if(!inPet(e.clientX,e.clientY))return;rub={x:e.clientX,dir:0,last:e.clientX,rev:0,t:Date.now(),fired:0}},{passive:true});
    st.addEventListener('pointermove',e=>{if(!rub)return;const dx=e.clientX-rub.last;if(Math.abs(dx)<10)return;const d=dx>0?1:-1;if(rub.dir&&d!==rub.dir)rub.rev++;rub.dir=d;rub.last=e.clientX;
      if(rub.rev>=3&&Date.now()-rub.fired>1200){rub.fired=Date.now();rub.rev=0;suppress=Date.now();petted()}},{passive:true});
    const end=()=>{if(rub&&rub.fired)suppress=Date.now();rub=null};st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);st.addEventListener('pointerleave',end);
  }
  function handleTap(e){
    /* returns true when handled here (petting tail or call-over) */
    if(Date.now()-suppress<400)return true;
    lastTouch=Date.now();
    if(blocked()||stageOf(S.active)==='egg'||S.resting)return false;
    if(inPet(e.clientX,e.clientY,22))return false;
    const sr=$('stage').getBoundingClientRect();if(e.clientY<sr.top+sr.height*.35)return false;
    const x=e.clientX-(sr.left+sr.width/2);gen++;busy=true;const g=gen;body().classList.remove(...ACTS);emote($('petWrap'),'excl',900);
    const dir=x>px?1:-1;setFace(dir);(async()=>{await walkTo(x-dir*30,150);if(g!==gen)return;setFace(dir);await hop();if(g===gen){busy=false;mood()}})();
    return true;
  }
  /* ---- feeding: treat flies in, chomp ---- */
  async function chomp(pic){
    gen++;busy=true;const g=gen;const st=$('stage'),sr=st.getBoundingClientRect(),pr=petRect();
    const tr=el('span',{class:'flytreat'},pixImg(pic));st.append(tr);
    const tx=pr.left+pr.width/2-sr.left,ty=pr.top+pr.height*.45-sr.top;
    tr.style.setProperty('--x0',(sr.width-30)+'px');tr.style.setProperty('--y0',(sr.height*.35)+'px');tr.style.setProperty('--x1',(tx-14)+'px');tr.style.setProperty('--y1',(ty-14)+'px');
    await wait(650);tr.remove();
    await act('life-chomp',1000);hearts(5);emote($('petWrap'),'love',1500);await hop();
    if(g===gen){busy=false;mood()}
  }
  /* ---- ball game ---- */
  async function ball(){
    if(stageOf(S.active)==='egg'){toast('Hatch your egg first!');return}
    if(S.resting){S.resting=false;save();renderHome()}
    gen++;busy=true;const g=gen;body().classList.remove(...ACTS);
    const st=$('stage'),pz=zone();const floor=parseFloat(getComputedStyle(pz).bottom)||96;
    const b=el('span',{class:'toyball'});b.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FF8AA8" stroke="#2B211D" stroke-width="2"/><path d="M3 10c4 2 14 2 18 0M5 17c4-2 10-2 14 0" stroke="#FFFFFF" stroke-width="2.4" fill="none"/><circle cx="8.5" cy="7.5" r="2" fill="#fff" opacity=".7"/></svg>';
    b.style.bottom=floor+'px';st.append(b);
    const W2=st.clientWidth/2,r=range();
    const throwTo=(x,ms,h)=>{b.style.setProperty('--bx',(W2+x-14)+'px');b.style.setProperty('--bh',h+'px');b.style.setProperty('--bt',ms+'ms');b.classList.remove('fly');void b.offsetWidth;b.classList.add('fly');return wait(ms)};
    b.style.setProperty('--bx',(W2+(Math.random()<.5?-1:1)*(W2+30))+'px');
    let bx=(Math.random()<.5?-1:1)*R(r*.6,r+30);
    await throwTo(bx,700,90);
    talk(rnd(persona().tap),S.active);
    for(let i=0;i<3&&g===gen;i++){
      emote($('petWrap'),'excl',800);
      await walkTo(bx-(bx>px?34:-34),170);if(g!==gen)break;
      setFace(bx>px?1:-1);await act('life-kick',420);
      bx=bx>0?-R(r*.5,r+20):R(r*.5,r+20);await throwTo(bx,800,120+Math.random()*40);
    }
    if(g===gen){await walkTo(bx-(bx>px?34:-34),170);await hop();hearts(5);emote($('petWrap'),rnd(['haha','happy','clap']),1600);addFriend(S.active,2,'play');S.mood=Math.min(100,S.mood+8);save();
      b.classList.add('pop');await wait(400);busy=false;mood()}
    b.remove();
  }
  return {start:loop,sync,reset,mood,bindTouch,handleTap,chomp,ball,touch:()=>{lastTouch=Date.now()}};
})();

/* particle engine on a canvas laid over a scene */
function FX(canvas,type,opts={}){
  const ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,raf=0,last=0,ps=[],bursts=[],ripples=[],stopped=false,filled=false;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const N={snow:70,petal:26,leaf:18,rain:90,spark:26,star:46,mote:16,fluff:10,firefly:18}[type]||0;
  const R=Math.random;

    if(type==='snow'){p.vy=18+p.s*26;p.z=p.s<.35?2:p.s<.8?3:4}
    else if(type==='petal'||type==='leaf'){p.vy=22+p.s*18;p.z=type==='leaf'?5:4;p.c=type==='leaf'?(opts.leaf||['#E8833A'])[Math.floor(R()*(opts.leaf||[1]).length)]:(R()<.5?'#F7B6C8':'#FCD6E0')}
    else if(type==='rain'){p.vy=420+p.s*160;p.len=8+p.s*8;p.y=init?R()*H:-20-R()*H*.3}
    else if(type==='spark'||type==='mote'||type==='fluff'||type==='firefly'){p.vy=-(6+p.s*10);if(type==='firefly'){p.vy=-(2+p.s*6);p.y=init?H*(.2+R()*.7):H*(.3+R()*.65)};p.y=init?R()*H:H*(.55+R()*.4);p.life=0;p.max=4+R()*5}
    else if(type==='star'){p.y=R()*H*.55;p.vy=0}

      ctx.save();if(mir){ctx.translate(x+w,y);ctx.scale(-1,1);ctx.drawImage(im,0,0,w,h)}else ctx.drawImage(im,x,y,w,h);ctx.restore()});
  }

  ctx.font=`600 ${12*k}px "M PLUS Rounded 1c", ui-rounded, sans-serif`;ctx.fillStyle='#7E6B62';const d=new Date(now()).toLocaleDateString();const t=`${label} · ${d}`;ctx.fillText(t,W-ctx.measureText(t).width-16*k,H+35*k);
  const blob=await new Promise(res=>cv.toBlob(res,'image/png'));const url=URL.createObjectURL(blob);
