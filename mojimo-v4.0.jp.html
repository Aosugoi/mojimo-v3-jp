<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mojimo v4.0.jp — Raise a Mojimo, Learn Japanese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF9E8; --surface:#FFFDF5; --ink:#30201F; --ink2:#62443E; --muted:#7E6B62; --faint:#C9B79A; --hair:#EADFC6;
  --accent:#B94E68; --accent2:#E99AA5; --accent-l:#F7DFE0;
  --lav:#A05A70; --lav-l:#F4DADD; --green:#477B58; --green-l:#E1EAD9; --red:#B8453E; --red-l:#F8E0DA; --gold:#D9A53A; --gold-l:#FBEFC4;
  --sh1:0 1px 2px rgba(70,43,35,.06),0 4px 14px rgba(70,43,35,.07);
  --sh2:0 2px 6px rgba(70,43,35,.07),0 14px 34px rgba(70,43,35,.10);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#F9E8AE,#F7E3A3 58%,#F6DFA0);background-attachment:fixed;display:flex;justify-content:center;font-weight:500;-webkit-font-smoothing:antialiased}
body [lang="ja"],.jp{font-family:"M PLUS Rounded 1c",sans-serif}
b,strong{font-weight:700}
.pill b,.coinpill b{font-weight:800}
.pill b,.coinpill b,.xpmeta,.reward b,.lx,.wprog span,.gpl,#daysN,.rushscore,.qx{font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px;border-radius:12px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{width:100%;max-width:440px;height:100vh;height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(70,43,35,.12)}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.hidden{display:none!important}
.scroll{flex:1;overflow-y:auto;padding:0 20px 28px}
.sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 18px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h2{font-size:24px;margin:0;font-weight:800;letter-spacing:-.02em}

/* buttons */
.bigbtn{display:block;width:100%;min-height:54px;border-radius:16px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;padding:14px 18px;text-align:center;transition:transform .12s;box-shadow:0 6px 16px rgba(70,43,35,.18)}
.bigbtn:active:not(:disabled){transform:scale(.98)}
.bigbtn small{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:2px}
.bigbtn.green{background:var(--green);box-shadow:0 6px 16px rgba(71,123,88,.25)}
.bigbtn.red{background:var(--red);box-shadow:0 6px 16px rgba(229,72,77,.25)}
.bigbtn.white{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--hair)}
.bigbtn.gold{background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 8px 20px rgba(185,78,104,.3)}
.bigbtn:disabled{background:#EFE5CF;color:#B3A086;box-shadow:none}
.link{display:block;width:100%;padding:12px;color:var(--muted);font-size:14px;font-weight:600;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;box-shadow:var(--sh1)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh1);padding:16px;margin-top:12px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:28px 16px;background:var(--surface);border-radius:var(--r);margin:12px 0;box-shadow:var(--sh1)}

/* page head */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 20px 16px}
.ph-jp{font-size:13px;color:var(--muted);font-weight:500}
.ph-en{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.coinpill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:99px;padding:7px 12px 7px 9px;font-size:14px;font-weight:700;box-shadow:var(--sh1)}

/* ===== HOME ===== */
.hscroll{flex:1;overflow-y:auto;padding:0 20px 20px}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 14px}
.greet .g-en{font-size:22px;font-weight:800;letter-spacing:-.02em}
.greet .g-jp{font-size:13px;color:var(--muted);margin-top:1px}
.top-r{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;height:36px;background:var(--surface);border-radius:99px;padding:0 12px 0 10px;font-size:14px;font-weight:700;box-shadow:var(--sh1)}
.pill .i{width:18px;height:18px}
.pill.streak{color:var(--accent)}.pill.streak b{color:var(--ink)}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:var(--sh1);color:var(--ink2)}
.iconbtn .i{width:19px;height:19px}
.stage{position:relative;height:clamp(250px,40vh,340px);border-radius:32px;overflow:hidden;background:radial-gradient(120% 90% at 50% 100%,var(--c2,#F6E3B4) 0%,var(--c1,#FBF1D3) 58%,#FFFFFF 100%);box-shadow:var(--sh2);cursor:pointer;transition:background .6s}
.stage:before{content:"";position:absolute;left:50%;bottom:-40%;width:130%;height:80%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.75),transparent);pointer-events:none}
.stage.rest{--c1:#3A3768;--c2:#25234A;background:radial-gradient(120% 90% at 50% 100%,#3E3A72 0%,#24224A 60%,#1A1938 100%)}
.stage.rest:before{background:radial-gradient(closest-side,rgba(160,150,255,.18),transparent)}
.particles span{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;animation:drift 9s ease-in-out infinite}
.stage.rest .particles span{width:3px;height:3px;opacity:.9;animation:twinkle 3s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.stage .moodchip{position:absolute;left:16px;top:16px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--ink2);z-index:3}
.stage .moodchip i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.stage.rest .moodchip{background:rgba(255,255,255,.14);color:#F7E9C9}
.capbtn{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);display:grid;place-items:center;color:var(--accent);z-index:3;box-shadow:0 4px 12px rgba(70,43,35,.08)}
.capbtn .badge{position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2.5px #fff;animation:bump 1.8s ease-in-out infinite}
.stage.rest .capbtn{background:rgba(255,255,255,.14);color:#FFB8A8}
.petzone{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.petzone .shadow{width:62%;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(70,43,35,.16),transparent);margin-top:-6px}
.pet-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.pet{display:block;transform-origin:50% 100%;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(70,43,35,.08))}
.pet.egg{width:92px}.pet.baby{width:168px}.pet.young{width:204px}
.taphint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:rgba(70,43,35,.38);font-weight:600;z-index:2}
.stage.rest .taphint{color:rgba(255,255,255,.4)}
.bubble{position:absolute;left:62%;bottom:78%;background:#fff;border-radius:16px 16px 16px 4px;padding:9px 13px;font-size:14px;font-weight:700;line-height:1.3;box-shadow:var(--sh2);width:max-content;max-width:170px;z-index:6;animation:pop .2s ease-out}
.bubble small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.pet-body{position:relative;transform-origin:50% 100%;line-height:0}
.acc{position:absolute;z-index:3;pointer-events:none;line-height:0}
.acc .pix{display:block;width:100%;height:auto}
.shopitem.nofit{opacity:.45}
.shopitem.nofit small{color:#B8453E}
.shopsub{font-size:12.5px;font-weight:800;color:var(--muted);margin:12px 2px 6px;text-align:left}
.shopnote{font-size:12.5px;color:var(--muted);margin:-2px 2px 4px;text-align:left}
.emote{position:absolute;right:60%;bottom:76%;width:64px;z-index:7;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(60,40,30,.18));transform-origin:80% 100%;animation:emoteIn .32s cubic-bezier(.3,1.6,.5,1) both}
.emote.out{animation:emoteOut .24s ease-in forwards}
.feedstage{position:relative}
.feedstage img.emote{width:60px;left:auto;right:62%;bottom:24%}
.hm-in .emote{left:auto;right:66%;bottom:60%;width:44px}
@keyframes emoteIn{from{transform:scale(.2) translateY(10px);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes emoteOut{to{transform:scale(.6) translateY(-6px);opacity:0}}
.emobtn{position:absolute;left:14px;bottom:12px;width:44px;height:44px;border-radius:50%;background:#FFF9E8;box-shadow:0 0 0 2px var(--line),0 3px 0 var(--line);display:grid;place-items:center;z-index:8}
.emobtn img{width:30px;image-rendering:pixelated}
.emobtn .stkico{width:31px;height:31px;display:block;margin-top:2px}
.emobtn.hang{z-index:1002}
.emopick{position:absolute;left:10px;right:10px;bottom:64px;z-index:1003;background:#FFF9E8;border-radius:18px;box-shadow:0 0 0 2.5px var(--line),0 4px 0 var(--line);padding:8px 8px 6px;animation:pop .2s ease-out;display:flex;flex-direction:column;max-height:min(58%,380px)}
.emohead{display:flex;align-items:center;gap:8px;padding:2px 4px 6px}.emohead b{font-size:15px}.emohead small{color:var(--muted);font-size:11.5px;flex:1;line-height:1.2}.emohead .emox{width:30px;height:30px;flex:none}
.emogrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;overflow-y:auto;overscroll-behavior:contain;padding:2px}
.mystamp{position:absolute;right:14px;top:92px;z-index:8;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;animation:mystIn .35s cubic-bezier(.3,1.5,.5,1) both}
.mystamp img{width:84px;filter:drop-shadow(0 3px 3px rgba(60,40,30,.2))}
.mystamp.out{transition:opacity .3s,transform .3s;opacity:0;transform:translateY(-10px)}
.mycap{background:#FFFDF6;border-radius:12px;padding:3px 10px;box-shadow:0 0 0 2px var(--line);text-align:center;line-height:1.15}.mycap b{font-size:14px;display:block}.mycap small{font-size:11px;color:var(--muted);font-weight:700}
@keyframes mystIn{from{opacity:0;transform:translateY(18px) scale(.7)}to{opacity:1;transform:none}}
.emopick .emogrid button{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;padding:2px}
.emopick button:active{background:#FBDCE1}
.emopick .emogrid img{width:100%;height:100%;object-fit:contain}
.emopick .emox{color:var(--muted)}.emopick .emox .i{width:18px;height:18px}
.vcredit{text-align:center;font-size:11px;color:var(--muted);margin:10px 0 0}
.kanjipic{display:inline-grid;place-items:center;min-width:64px;height:64px;padding:0 10px;border-radius:16px;background:#FBF1D3;box-shadow:0 0 0 2px var(--tan);font-size:34px;font-weight:800;color:var(--ink);font-family:"M PLUS Rounded 1c",sans-serif}
.opt .pic .kanjipic{min-width:40px;height:40px;font-size:20px;border-radius:10px}
.wnote{font-size:12px;color:var(--muted);margin:8px 4px 2px;padding:0 6px}
.giftmodal .giftstage{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0}
.giftstage img{width:130px}.giftstage img.emote{width:60px;position:absolute;right:60%;bottom:22%}
.giftstage .bubble{position:relative;left:auto;bottom:auto;font-size:16px;white-space:nowrap;max-width:none}
.giftlist{text-align:left;margin:4px auto 10px;padding-left:20px;font-size:14px;font-weight:700;max-width:260px}
.giftrow{display:flex;align-items:center;gap:12px;justify-content:center;background:var(--tile);border-radius:14px;padding:8px 14px;margin:4px auto 0;max-width:240px;box-shadow:0 0 0 2px var(--tan)}
.giftrow .pic .pix{width:40px;height:40px}.giftrow small{display:block;color:var(--muted);font-size:12px}
.shopitem.limited{position:relative}.shopitem.limited:after{content:"Limited";position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:800;background:#E07E92;color:#fff;border-radius:99px;padding:2px 6px}
.seasoncard .ri{background:#FDE3E7}.seasoncard .ri .pix{width:30px;height:30px}
.seasoncard .rt{display:flex;flex-direction:column;text-align:left;flex:1;min-width:0}.seasoncard small{font-size:12px;color:var(--muted);font-weight:500}
.frrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--ink2);flex-wrap:wrap}
.frrow small{width:100%;font-size:11.5px;color:var(--muted);font-weight:500}
.frhearts{display:inline-flex;gap:3px}.frhearts i{width:14px;height:12px;background:#EADFC6;clip-path:path('M7 12 1 6A3.2 3.2 0 0 1 7 2a3.2 3.2 0 0 1 6 4z')}.frhearts i.on{background:#E07E92}
.emopick button{position:relative}.emopick button.locked img{opacity:.3;filter:grayscale(1)}
.elock{position:absolute;bottom:0;right:0;font-size:9px;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:1px 3px}
.cambtn{position:absolute;left:64px;top:10px;width:44px;height:44px;border-radius:50%;background:#FFF9E8;box-shadow:0 0 0 2px var(--line),0 3px 0 var(--line);display:grid;place-items:center;z-index:1002;color:var(--ink)}
.cambtn .i{width:22px;height:22px}
.emobtn.hang{left:10px;top:10px;bottom:auto}
.flash{position:absolute;inset:0;background:#fff;z-index:1005;animation:flash .4s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.photoprev{width:100%;border-radius:16px;box-shadow:0 0 0 2px var(--tan);margin:6px 0 12px;display:block}
.modal a.bigbtn{text-decoration:none;display:block}
.clog{text-align:left;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.clog-item{background:var(--surface);border-radius:16px;box-shadow:0 0 0 2px var(--tan);padding:10px 12px}
.clog-item.new{background:#FDE3E7;box-shadow:0 0 0 2.5px var(--line),0 3px 0 var(--line)}
.clog-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.clog-h b{font-size:15px}.clog-h span{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.clog ul{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.5}
.acc-over{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;image-rendering:pixelated}
.acc.c{transform:translate(-50%,-50%)}.acc.b{transform:translate(-50%,-100%)}
#nameTap{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border-radius:10px}
#nameTap .spk{width:18px;height:18px;color:var(--muted);opacity:.7}
#nameTap:active{transform:scale(.97)}
.aura{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.85),transparent);animation:halo 2.8s ease-in-out infinite;pointer-events:none}
.zzz{position:absolute;top:-10px;right:6%;font-size:18px;color:#F7E9C9;font-weight:800;animation:zz 2.4s ease-in-out infinite;z-index:4}
.heart{position:absolute;z-index:5;font-size:18px;color:var(--accent);pointer-events:none;animation:floatup 1s ease-out forwards}
.identity{padding:20px 4px 6px}
.idrow{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}
.nm{display:flex;align-items:center;gap:10px}
.nm #petName{font-size:28px;font-weight:800;letter-spacing:-.03em}
.stagechip{font-size:12px;font-weight:700;color:var(--lav);background:var(--lav-l);border-radius:99px;padding:4px 10px}
.sub2{font-size:14px;color:var(--muted);margin-top:2px}
.idrow .chev{color:var(--faint)}
.xp{margin-top:16px}
.xpbar{height:10px;border-radius:99px;background:#EADFC6;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .8s cubic-bezier(.3,.8,.3,1)}
.xpmeta{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted);font-weight:600}
.xpmeta b{color:var(--ink)}
.continue{display:flex;align-items:center;gap:14px;width:100%;margin-top:18px;background:var(--surface);border-radius:var(--r);padding:16px 16px 16px 18px;box-shadow:var(--sh2);text-align:left;transition:transform .12s}
.continue:active{transform:scale(.985)}
.c-l{flex:1;min-width:0}
.c-k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
.c-t{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-m{font-size:13px;color:var(--muted)}
.c-go{width:52px;height:52px;border-radius:50%;background:var(--ink);display:grid;place-items:center;color:#fff;flex-shrink:0;box-shadow:0 6px 14px rgba(70,43,35,.2)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.act .ai{width:58px;height:58px;border-radius:20px;background:var(--surface);display:grid;place-items:center;box-shadow:var(--sh1);color:var(--ink);transition:transform .12s}
.act:active .ai{transform:scale(.94)}
.act:disabled{opacity:.4}
.rowcard{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;background:var(--surface);border-radius:20px;padding:14px 16px;box-shadow:var(--sh1);text-align:left}
.rowcard .ri{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
.rowcard .rt{flex:1;min-width:0}
.rowcard .rt b{display:block;font-size:15px;font-weight:700}
.rowcard .rt span{font-size:13px;color:var(--muted)}
.rowcard .chev{color:var(--faint)}
.dots{display:flex;gap:5px}.dots i{width:22px;height:6px;border-radius:99px;background:#EADFC6}.dots i.on{background:var(--green)}
.wotd-jp{font-size:20px;font-weight:700;letter-spacing:.02em}

/* nav */
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--hair);padding:6px 6px 10px}
.nav button{padding:6px 0;font-size:11px;font-weight:700;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav .dot{position:relative;display:inline-block}.nav .dot:after{content:"";position:absolute;top:0;right:-2px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px #fff}

/* ===== JOURNEY ===== */
.wcard{background:var(--surface);border-radius:26px;box-shadow:var(--sh1);margin-bottom:14px;overflow:hidden}
.wtop{display:flex;align-items:center;gap:14px;padding:18px}
.wicon{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;flex-shrink:0}
.wicon svg{width:28px;height:28px}
.wname{font-size:18px;font-weight:800;letter-spacing:-.02em}
.wtopic{font-size:13px;color:var(--muted);margin-top:1px}
.wprog{margin-left:auto;position:relative;width:44px;height:44px;flex-shrink:0}
.wprog svg{width:44px;height:44px;transform:rotate(-90deg)}
.wprog span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800}
.wcard.locked{opacity:.6}
.wcard.locked .wtop{padding:14px 18px}
.wlock{margin-left:auto;color:var(--faint)}
.lessons{list-style:none;margin:0;padding:0 12px 12px;position:relative}
.lrow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 10px;border-radius:18px;text-align:left;position:relative}
.lrow+.lrow{margin-top:2px}
.lrow .ls{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:#F4EBD8;color:var(--faint);font-size:14px;font-weight:800;position:relative;z-index:1}
.lrow.done .ls{background:var(--green-l);color:var(--green)}
.lrow.current{background:var(--accent-l)}
.lrow.current .ls{background:var(--accent);color:#fff;box-shadow:0 6px 14px rgba(185,78,104,.35)}
.lrow .lt{flex:1;min-width:0}
.lrow .lt b{display:block;font-size:15px;font-weight:700}
.lrow .lt small{font-size:12.5px;color:var(--muted)}
.lrow.locked .lt b{color:var(--faint)}
.lrow .lx{font-size:12px;font-weight:700;color:var(--muted)}
.lrow.current .lx{color:var(--accent)}
.lessons:before{content:"";position:absolute;left:41px;top:30px;bottom:34px;width:2px;background:#F4EBD8}
.lrow .trailpet{position:absolute;right:58px;top:50%;transform:translateY(-55%);width:42px;pointer-events:none}

/* ===== REVIEW ===== */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.mchip{font-size:11.5px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap}
.m0{background:#F4EBD8;color:#7E6B62}.m1{background:#FFF4DE;color:#B07B12}.m2{background:#EAF1FD;color:#3D6BC4}.m3{background:#F1ECFE;color:#6D4FD6}.m4{background:#E1EAD9;color:#1B8A5E}
.wordrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--hair)}
.wordrow:first-child{border-top:0}
.wordrow .wj{font-size:19px;font-weight:700;min-width:100px;font-family:"M PLUS Rounded 1c",sans-serif}
.wordrow .wm{flex:1;font-size:13px;color:var(--muted);line-height:1.4}
.wordrow .wm b{color:var(--ink);font-size:14px;font-weight:700}
.wordrow .due{color:var(--accent);font-weight:700}

/* ===== COLLECTION ===== */
.dailyhead{display:flex;justify-content:space-between;align-items:baseline}
.dailyhead b{font-size:16px;font-weight:800}
.dailyhead span{font-size:12.5px;color:var(--muted);font-weight:600}
.milestones{margin:0 0 6px}
.ms{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--hair);font-size:14px;font-weight:600}
.ms:nth-child(2){border-top:0}
.ms .mi{width:32px;height:32px;border-radius:11px;background:var(--lav-l);display:grid;place-items:center;font-size:15px}
.ms .mt{flex:1}.ms .mt small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.ms .ok{color:var(--green);font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{background:var(--surface);border-radius:20px;padding:12px 6px 10px;text-align:center;font-size:13px;font-weight:700;min-height:138px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;box-shadow:var(--sh1);transition:transform .12s}
.slot:active:not(:disabled){transform:scale(.97)}
.slot img{max-width:84%;max-height:72px;margin-bottom:6px}
.slot.locked{background:#F6EEDB;box-shadow:none;color:var(--faint)}
.slot.locked img{filter:brightness(0);opacity:.08}
.slot.active{box-shadow:0 0 0 2px var(--accent),var(--sh1)}
.slot small{color:var(--muted);font-size:11px;font-weight:500;line-height:1.3}

/* ===== LESSON ===== */
.lessontop{display:flex;align-items:center;gap:14px;padding:16px 20px 8px}
.lessontop .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:0}
.lprog{flex:1;height:8px;border-radius:99px;background:#EADFC6;overflow:hidden}
.lprog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .4s ease;border-radius:99px}
.mini{width:40px;height:36px;object-fit:contain;transform-origin:50% 100%}
.ex{flex:1;padding:14px 20px 8px;display:flex;flex-direction:column;overflow-y:auto}
.ex .q{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 18px;line-height:1.3}
.promptcard{background:var(--surface);border-radius:26px;padding:28px 18px;text-align:center;margin-bottom:18px;position:relative;box-shadow:var(--sh1)}
.glyph{font-size:72px;line-height:1.15;font-weight:700;font-family:"M PLUS Rounded 1c",sans-serif}
.glyph.word{font-size:46px}
.glyph.en{font-size:28px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;letter-spacing:-.02em}
.romaji{font-size:16px;color:var(--muted);margin-top:6px;font-weight:600}
.opt small.ansrj,.tile small.ansrj{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px;letter-spacing:0}.tile small.ansrj{font-size:11px;margin-top:0}
.meaning{font-size:18px;margin-top:6px;font-weight:700}
.pic{font-size:40px;line-height:1;margin-bottom:6px}
.speak{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;background:var(--lav-l);color:var(--lav);font-size:15px;display:grid;place-items:center}
.peek{position:absolute;left:14px;top:14px;font-size:12px;font-weight:700;background:#F4EBD8;border-radius:99px;padding:5px 10px;color:var(--muted)}
.speakbig{width:104px;height:104px;border-radius:50%;background:var(--lav);color:#fff;font-size:38px;margin:6px auto 14px;display:grid;place-items:center;box-shadow:0 12px 28px rgba(139,124,246,.35);transition:transform .12s}
.speakbig:active{transform:scale(.95)}
.novoice{text-align:center;font-size:13px;color:var(--muted);margin:-4px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:68px;background:var(--surface);border-radius:18px;box-shadow:inset 0 0 0 1.5px var(--hair),0 1px 2px rgba(70,43,35,.04);font-size:18px;font-weight:700;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .1s,box-shadow .15s,background .15s;line-height:1.2}
.opt small{font-size:12px;color:var(--muted);font-weight:600}
.opt .pic{font-size:28px;margin:0}
.opt.big{font-size:26px}
.opt:active:not(:disabled){transform:scale(.97)}
.opt.sel{box-shadow:inset 0 0 0 2px var(--lav);background:var(--lav-l)}
.opt.right{box-shadow:inset 0 0 0 2px var(--green);background:var(--green-l)}
.opt.wrong{box-shadow:inset 0 0 0 2px var(--red);background:var(--red-l);animation:shake .3s}
.opt.gone{opacity:.2;pointer-events:none}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.matchgrid .col{display:flex;flex-direction:column;gap:10px}
.matchgrid .opt{min-height:56px;font-size:16px}
.answerrow{min-height:70px;border-bottom:1.5px solid var(--hair);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px 0;margin-bottom:20px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:54px;height:52px;padding:0 14px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--hair),0 2px 4px rgba(70,43,35,.05);font-size:20px;font-weight:700;font-family:"M PLUS Rounded 1c",sans-serif}
.tile.used{visibility:hidden}
.recall input{width:100%;font-size:22px;padding:16px;border:0;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--hair);text-align:center;font-weight:700}
.recall input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--lav)}
.recall .hintline{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.askrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:18px}
.buddy{display:flex;align-items:center;gap:8px;padding:0 20px 2px;min-height:58px;position:relative}
.bpet{width:58px;height:54px;object-fit:contain;object-position:50% 100%;transform-origin:50% 100%;flex:none}
.bbub{position:absolute;left:84px;top:2px;z-index:8;white-space:nowrap;background:#fff;border:2px solid var(--ink,#2b211d);border-radius:14px 14px 14px 4px;padding:5px 10px;font-weight:800;font-size:14px;line-height:1.2;max-width:none;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.bbub small{display:block;font-size:11px;font-weight:600;color:var(--muted)}.bbub small.brj{color:#b07a8a;font-size:10.5px}
.bbub.hidden{visibility:hidden}.bbub.pop{animation:pop .2s ease}
.bside{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.combo{display:flex;align-items:center;gap:2px}
.combo .ch{width:18px;height:18px;display:grid;place-items:center;opacity:.22;filter:grayscale(1);transition:opacity .2s,filter .2s}
.combo .ch img{width:16px;height:16px;image-rendering:pixelated}
.combo .ch.on{opacity:1;filter:none}.combo .ch.pop{animation:bump .4s ease}
.combo .cx{font-size:12px;color:#c4566f;margin-left:3px}
.helpbtn{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:4px 10px 4px 6px;border-radius:999px;background:#fff6dc;border:2px solid #e8c873;color:#7a5a12}
.helpbtn b{background:#e8b44c;color:#fff;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;font-size:11px}
.helpbtn .hpic img{width:16px;height:16px;image-rendering:pixelated;display:block}
.helpbtn:disabled{opacity:.4}
.opt.squash{transform:scale(.88);opacity:.28;filter:grayscale(1);pointer-events:none;transition:transform .25s,opacity .25s}
.bspark{position:fixed;z-index:50;pointer-events:none;transition:transform .7s ease-out,opacity .7s ease-out}.bspark img{width:16px;height:16px;image-rendering:pixelated}
.feedgrid{grid-template-columns:1fr 1fr}
.opt.feedcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px}
.feedcard .fpic img,.fpic.fly img{width:58px;height:58px;image-rendering:pixelated;display:block}
.feedcard small{font-size:13px;color:var(--muted);font-weight:700}
.fpic.fly{position:fixed;z-index:60;pointer-events:none;transition:transform .5s cubic-bezier(.4,-0.3,.6,1),opacity .5s}
.askrow .feedpet,.askrow .tfpet{width:104px}
.tfbub .tfw{font-size:26px;display:block}.tfbub .tfc{display:block;font-size:15px;margin-top:4px}
.tfgrid{grid-template-columns:1fr 1fr}
.opt.tfopt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px}
.tfopt .tfic{font-size:34px;line-height:1}.tfopt small{font-size:14px;font-weight:800;color:var(--ink,#2b211d)}
.askrow img{width:110px}
.askrow .bubble{position:relative;left:auto;bottom:auto;margin-bottom:54px;font-size:16px;max-width:none}
.tipline{font-size:13.5px;color:var(--muted);margin:2px 0 0;line-height:1.55;text-align:center}
.footer{padding:14px 20px 20px;transition:background .2s;border-radius:26px 26px 0 0}
.footer.ok{background:var(--green-l)}.footer.bad{background:var(--red-l)}
.verdict{font-size:18px;font-weight:800;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px}
.verdict>span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;flex-shrink:0}
.footer.ok .verdict{color:#3A6648}.footer.ok .verdict>span{background:var(--green)}
.footer.bad .verdict{color:#B4282D}.footer.bad .verdict>span{background:var(--red)}
.verdict small{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin-top:3px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ===== RESULTS ===== */
.results{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;text-align:center;gap:4px;overflow-y:auto}
.results h2{font-size:28px}
.ring{position:relative;width:196px;height:196px;margin:10px 0 4px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring img{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);max-width:130px;max-height:110px}
.rewards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:16px 0 10px}
.reward{background:var(--surface);border-radius:18px;padding:12px 6px;box-shadow:var(--sh1)}
.reward b{display:block;font-size:20px;font-weight:800}
.reward small{font-size:11.5px;color:var(--muted);font-weight:600}
.xplines{font-size:13.5px;color:var(--muted);line-height:1.6;font-weight:500}
.masterylist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 16px}
.spark{position:fixed;z-index:50;font-size:16px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-.3,.6,1),opacity .7s}

/* ===== SHEETS / MODALS ===== */
.overlay{position:absolute;inset:0;z-index:40;background:rgba(24,20,36,.42);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease-out}
.modal{background:var(--surface);border-radius:30px 30px 0 0;padding:12px 20px 24px;width:100%;max-height:90%;overflow-y:auto;text-align:center;box-shadow:0 -10px 40px rgba(70,43,35,.15);animation:sheet .28s cubic-bezier(.2,.9,.3,1)}
.modal:before{content:"";display:block;width:40px;height:5px;border-radius:99px;background:#E4D7B8;margin:0 auto 14px}
.modal h3{font-size:22px;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
.modal p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 16px}
.modal .bigbtn+.bigbtn{margin-top:10px}
.mkicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
@keyframes sheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.eggpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
.eggopt{border-radius:20px;padding:14px 4px 10px;background:#FFF9E8;font-size:12.5px;color:var(--muted);font-weight:700;transition:box-shadow .15s,background .15s}
.eggopt img{height:84px;display:block;margin:0 auto 8px}
.eggopt[aria-pressed="true"]{background:var(--accent-l);box-shadow:inset 0 0 0 2px var(--accent);color:var(--ink)}
.compcard img{max-height:120px;max-width:200px;margin:6px auto;display:block}
.compcard .romaji{margin-top:0}
.traitrow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.traitrow span{font-size:12.5px;background:#F4EBD8;border-radius:99px;padding:5px 11px;font-weight:700;color:var(--ink2)}
.bar{height:10px;border-radius:99px;background:#EADFC6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.quest{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--hair)}
.quest:first-child{border-top:0}
.quest .qi{width:26px;height:26px;border-radius:50%;background:#F4EBD8;display:grid;place-items:center;font-size:0}
.quest.done .qi{background:var(--green)}
.quest.done .qi:after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.quest .qt{flex:1;font-size:14.5px;font-weight:700}
.quest .qt small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.quest .qx{font-size:12px;background:var(--green-l);color:#3A6648;border-radius:99px;padding:4px 9px;white-space:nowrap;font-weight:700}
.quest.done .qt{color:var(--muted)}
.quest.done .qx{background:#F4EBD8;color:var(--muted)}
.qbtn{font-size:12.5px;font-weight:700;border-radius:99px;padding:6px 12px;background:var(--ink);color:#fff}
.menu-list{text-align:left;margin-top:6px}
.menu-list button{display:flex;align-items:center;gap:14px;width:100%;padding:12px 4px;border-top:1px solid var(--hair);font-size:15px;font-weight:700}
.menu-list button:first-child{border-top:0}
.menu-list .mic{width:40px;height:40px;border-radius:14px;background:#F4EBD8;display:grid;place-items:center;color:var(--ink2)}
.menu-list small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.menu-list .val{margin-left:auto;font-size:13px;color:var(--muted)}
.wordday{font-size:56px;font-weight:700;line-height:1.2;margin:8px 0 2px;font-family:"M PLUS Rounded 1c",sans-serif}
/* shop */
.shophead{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 8px}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.shopitem{background:#FFF9E8;border-radius:18px;padding:12px 4px 10px;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;transition:box-shadow .15s}
.shopitem .sw{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(70,43,35,.06)}
.shopitem .pic{font-size:30px;margin:0;line-height:46px}
.shopitem small{color:var(--muted);font-size:11.5px;font-weight:600}
.shopitem.on{background:var(--accent-l);box-shadow:inset 0 0 0 2px var(--accent)}
.shopitem:disabled{opacity:.5}
/* feed */
.feedstage{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0 14px}
.feedstage img{width:130px}
.feedstage .bubble{position:relative;left:auto;bottom:auto;font-size:18px;border-radius:16px;white-space:nowrap;max-width:none}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.snack{border-radius:18px;background:#FFF9E8;padding:10px 2px;font-size:13px;font-weight:700;position:relative;font-family:"M PLUS Rounded 1c",sans-serif}
.snack .pic{font-size:28px;display:block;margin:0 0 2px}
.snack small{display:block;color:var(--muted);font-size:10.5px;font-family:"M PLUS Rounded 1c",sans-serif}
.snack .n{position:absolute;top:-6px;right:-4px;background:var(--ink);color:#fff;border-radius:99px;font-size:11px;padding:2px 7px;font-family:"M PLUS Rounded 1c",sans-serif}
.snack:disabled{opacity:.35}
.snack.wrong{animation:shake .3s;box-shadow:inset 0 0 0 2px var(--red)}
.rushbar{height:8px;border-radius:99px;background:#EADFC6;overflow:hidden;margin:10px 0 14px}
.rushbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .2s linear}
.rushq{font-size:48px;font-weight:700;margin:6px 0 16px;font-family:"M PLUS Rounded 1c",sans-serif}
.rushscore{font-size:14px;color:var(--muted);font-weight:700}

/* ===== EVOLUTION ===== */
.evo{position:absolute;inset:0;z-index:45;background:radial-gradient(90% 70% at 50% 40%,#3B3570,#16142C);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px;overflow:hidden}
.evo .stage{position:relative;height:230px;width:100%;display:grid;place-items:center;background:none;box-shadow:none;border-radius:0}
.evo .stage:before{display:none}
.evo .halo{position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,230,200,.55),transparent);animation:halo 2s ease-in-out infinite}
.evo img{position:relative;max-height:150px;max-width:230px}
.evo .s1{animation:hs .5s ease-in-out infinite}.evo .s2{animation:hs .2s ease-in-out infinite}
.evo .glow{filter:brightness(4) saturate(0);transition:filter .5s}
.evo .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.evo .flash.on{opacity:1}
.evo .land{animation:land .7s cubic-bezier(.3,1.6,.5,1)}
.evo h3{font-size:28px;margin:8px 0 2px;font-weight:800;letter-spacing:-.02em}
.evo .jp{font-size:17px;opacity:.7}
.evo .info{background:#fff;color:var(--ink);border-radius:22px;padding:16px 18px;margin:16px 0 18px;font-size:14.5px;line-height:1.6;max-width:330px}
.evo .info b{font-size:18px}
.evo .gift{display:inline-block;margin-top:8px;background:var(--gold-l);color:#9A6A08;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700}
.evo .bigbtn{background:#fff;color:var(--ink)}
.confetti{position:absolute;top:-20px;font-size:14px;animation:fall linear forwards}

/* ===== GACHA ===== */
.gacha{position:absolute;inset:0;z-index:44;background:linear-gradient(180deg,#FFF3D2 0%,#FFF9E8 55%);display:flex;flex-direction:column;align-items:center;padding:16px 20px 24px;overflow-y:auto;overflow-x:hidden}
.ghead{display:grid;grid-template-columns:40px 1fr auto;align-items:center;width:100%;gap:8px}
.gclose{width:38px;height:38px;border-radius:50%;background:var(--surface);box-shadow:var(--sh1);display:grid;place-items:center;color:var(--ink2);font-size:0}
.gjp{font-size:12.5px;color:var(--muted);text-align:center;font-weight:600}
.gen{font-size:20px;font-weight:800;letter-spacing:-.02em;text-align:center}
.gstage{position:relative;width:min(64%,240px);margin:14px 0 4px;flex-shrink:0}
.gsvg{width:100%;display:block}

@keyframes hring{0%{transform:scale(.85);opacity:.95}100%{transform:scale(1.18);opacity:.3}}
@keyframes htap{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,8px)}}

@keyframes halo{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.06);opacity:1}}

/* ===== cute skin (matches the original Mojimo look) ===== */
:root{--ink:#30201F;--ink2:#5A3E38;--muted:#7E6B62;--faint:#BCA88A;--hair:#E2D0A8;--surface:#FFFBEF;--bg:#FAEBB6;
  --tan:#D6C092;--tile:#F6EDD9;--line:#30201F;
  --sh1:0 0 0 2px var(--tan),0 4px 0 rgba(140,100,60,.18);
  --sh2:0 0 0 2.5px var(--line),0 6px 0 rgba(48,32,31,.9);--r:22px}
body,button,input{font-family:ui-rounded,"Arial Rounded MT Bold","M PLUS Rounded 1c",system-ui,sans-serif}
body [lang="ja"],.jp{font-family:ui-rounded,"Arial Rounded MT Bold","M PLUS Rounded 1c",sans-serif}
body{font-weight:500}
.app{background:linear-gradient(160deg,#FBEDB8,#F8E4A6 60%,#F6DE9C)}
.greet .g-en,.ph-en,.nm #petName,.modal h3,.gen{letter-spacing:-.01em;font-weight:800}
/* chunky outlined panels */
.stage{border-radius:28px}
.continue{border-radius:20px}
.continue:active,.bigbtn:active:not(:disabled){transform:translateY(3px)}
/* buttons: pink with a dark outline and offset, like the original PLAY NOW */
.bigbtn{background:#EFA3AE;color:var(--ink);border-radius:16px;font-weight:800;box-shadow:0 0 0 2.5px var(--line),0 5px 0 var(--line);margin-bottom:5px;letter-spacing:.01em}
.bigbtn:active:not(:disabled){box-shadow:0 0 0 2.5px var(--line),0 2px 0 var(--line)}
.bigbtn.gold{background:#EFA3AE;color:var(--ink);box-shadow:0 0 0 2.5px var(--line),0 5px 0 var(--line)}
.bigbtn.white{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--tan),0 4px 0 var(--tan)}
.bigbtn:disabled{background:#EFE3C8;color:#B39F82;box-shadow:0 0 0 2px #E2D3B2}
.footer.ok .bigbtn{background:#9FCB98}.footer.bad .bigbtn{background:#EFA3AE}
/* beige tiles with tan borders */
.act .ai,.menu-list .mic,.playopt .mic{background:var(--tile)}
.act .ai{box-shadow:0 0 0 2px var(--tan),0 4px 0 rgba(140,100,60,.2)}
.opt,.tile{background:var(--surface);box-shadow:0 0 0 2px var(--tan),0 4px 0 rgba(140,100,60,.18)}
.opt.sel{background:#FBDCE1;box-shadow:0 0 0 2.5px var(--line),0 4px 0 var(--line)}
.opt.right{background:#DDEED5;box-shadow:0 0 0 2.5px #477B58,0 4px 0 #477B58}
.opt.wrong{box-shadow:0 0 0 2.5px #B8453E,0 4px 0 #B8453E}
.shopitem,.eggopt{background:var(--tile);box-shadow:0 0 0 2px var(--tan)}
.shopitem.on,.eggopt[aria-pressed="true"]{background:#FBDCE1;box-shadow:0 0 0 2.5px var(--line),0 4px 0 var(--line)}
.playopt{background:var(--surface);box-shadow:0 0 0 2px var(--tan),0 4px 0 rgba(140,100,60,.18)}
.modal{background:#FFF9E8;box-shadow:0 0 0 2.5px var(--line),0 -6px 30px rgba(70,43,35,.18)}
.stagechip{background:#FBDCE1;color:#9E3F57;box-shadow:0 0 0 1.5px #E7A9B5}
.pill,.coinpill,.gclose,.hcount{background:var(--surface)}
.nav{background:#FFF9E8;border-top:2px solid var(--tan)}
.nav button[aria-current="page"]{color:#B94E68}
.capbtn{background:#FFF9E8;box-shadow:0 0 0 2px var(--line),0 3px 0 var(--line);backdrop-filter:none}
.moodchip{box-shadow:0 0 0 2px var(--tan)}
.xpbar,.lprog{background:#F0E3C4;box-shadow:inset 0 0 0 1.5px var(--tan)}
.xpbar i,.lprog i{background:linear-gradient(90deg,#F3B1BA,#E07E92)}
.lrow.current{background:#FBDCE1;box-shadow:0 0 0 2px #E7A9B5}
.lrow .ls{box-shadow:0 0 0 2px var(--tan)}
.lrow.current .ls{box-shadow:0 0 0 2.5px var(--line)}
.pagetip{background:#FDE3E7;color:#6B3D4A;box-shadow:0 0 0 2px #EDB3BE}
.speak{background:#FBDCE1;color:#B94E68;box-shadow:0 0 0 2px #E7A9B5}
.speakbig{background:#EFA3AE;color:var(--ink);box-shadow:0 0 0 3px var(--line),0 6px 0 var(--line)}
.hsw,.wav{box-shadow:0 0 0 2px var(--tan)}
.hchips button.on .hsw,.hchips.who button.on .wav,.hchips.who button.whoall.on .wav{box-shadow:0 0 0 2.5px var(--line),0 3px 0 var(--line)}
.hang-stage,.gresult{border-radius:26px}
.bubble,.hbub{box-shadow:0 0 0 2px var(--line),0 3px 0 var(--line)}
.toast{box-shadow:0 0 0 2px var(--line)}

.co-nt rt{display:none}
.co-nt>small{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-buddy{flex-shrink:0;height:32px;padding:0 12px;border-radius:99px;background:var(--accent-l);box-shadow:0 0 0 2px #E7A9B5;color:var(--accent);font-size:12.5px;font-weight:800;display:grid;place-items:center}
.cobody{padding-top:6px}
.co-h{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}.co-h b{font-size:15.5px;font-weight:800}.co-h span{font-size:13px;font-weight:700;color:var(--muted)}

.co-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;padding:4px 2px}

.co-badges{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 12px 8px}.co-badges::-webkit-scrollbar{display:none}
.co-b{flex-shrink:0;width:78px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.co-bi{width:50px;height:50px;border-radius:16px;background:#BFAE8E;box-shadow:0 0 0 2.5px var(--line);display:grid;place-items:center;color:#fff}.co-bi .i{width:22px;height:22px}
.co-b small{font-size:10.5px;font-weight:800;line-height:1.2}

#s-home .stage,.lscene,.cohero{overflow:hidden;overflow:clip}
#s-home .hscroll{overflow-x:hidden}

/* menu (condensed) */
.mmenu h3{margin-bottom:12px}
.mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mtile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:18px;background:var(--surface);box-shadow:0 0 0 2px var(--line),0 3px 0 var(--line);font-size:12.5px;font-weight:800;line-height:1.2;text-align:center}
.mti{width:46px;height:46px;border-radius:16px;display:grid;place-items:center}
.mti .i{width:24px;height:24px}.mti svg.stk{width:34px;height:34px}
.mti.cap{background:#FCE1E7;color:var(--accent)}.mti.hgo{background:#FFF1CF;color:#C4566F}.mti.sty{background:#F4EBD8}
.mhead{margin:18px 2px 8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left}
.mlang{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:16px;background:var(--tile)}
.mlang button{min-height:44px;border-radius:12px;font-size:14px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
svg.flag{width:24px;height:16px;border-radius:3px;box-shadow:0 0 0 1px rgba(43,33,29,.25);flex-shrink:0;display:block}
.mlang button[aria-pressed="false"] svg.flag{opacity:.75}
.menu-list .mic svg.flag{width:26px;height:17px}
.mlang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--line)}
.mtogs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.mtog{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 10px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 2px var(--tan);text-align:left}
.mtog-i{width:26px;height:26px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}.mtog-i svg{width:20px;height:20px}
.mtog-t{display:flex;flex-direction:column;min-width:0;line-height:1.15}.mtog-t b{font-size:13px;font-weight:800}.mtog-t small{font-size:11.5px;font-weight:700;color:var(--muted)}
.mtog[aria-pressed="true"]{background:#FCE1E7;box-shadow:0 0 0 2px #E7A9B5}.mtog[aria-pressed="true"] .mtog-i,.mtog[aria-pressed="true"] small{color:var(--accent)}
.mlinks{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 4px;margin-top:14px}
.mlink{min-height:40px;padding:0 10px;font-size:13.5px;font-weight:800;color:var(--accent);display:inline-flex;align-items:center;gap:6px}
.mbadge{font-size:10.5px;background:var(--accent);color:#fff;border-radius:99px;padding:1px 7px}
.mmenu .vcred{margin-top:8px;font-size:12px;color:var(--muted)}.mmenu .vcred summary{cursor:pointer;min-height:32px;display:inline-flex;align-items:center;font-weight:700;list-style:none}.mmenu .vcred summary::-webkit-details-marker{display:none}.mmenu .vcredit{margin-top:4px}

/* home HUD: stage moves to the XP line, so long names fit */
#s-home .idcard .spk{display:none}

 #s-home .bubble{bottom:78%;font-size:14px;max-width:190px}

}
/* ===== v4.1 Hangout: dance button always visible ===== */
.hang{overflow:hidden}
.hang-mid{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.hang-mid .hang-ctrl{margin-top:0;padding-bottom:8px}
.hang-foot{flex-shrink:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 -2px 0 var(--hair)}
.hang-foot .hdance{margin:0;width:100%}
@media (max-height:700px){.hang-stage{height:min(40vh,400px);min-height:200px}}
/* ===== v4.1 Review ===== */
.rbody{padding-top:2px}
.rbody .pagetip{width:auto;margin:3px 3px 12px}
.rsum{background:var(--surface);border-radius:22px;box-shadow:0 0 0 3px var(--line),0 4px 0 var(--line);padding:14px 16px;margin:3px 3px 0}
.rsum-t{display:flex;align-items:baseline;gap:8px}.rsum-t b{font-size:28px;font-weight:800;line-height:1}.rsum-t span{font-size:14px;font-weight:700;color:var(--muted)}
.rdue{margin-left:auto;align-self:center;font-size:12.5px!important;font-weight:800!important;padding:4px 10px;border-radius:99px;background:var(--green-l);color:var(--green)!important}
.rdue.on{background:var(--accent-l);color:var(--accent)!important}
.rbar{display:flex;gap:3px;height:12px;border-radius:99px;overflow:hidden;background:var(--tile);margin:12px 0 10px}
.rbar i{display:block;min-width:8px}
.rbar .m1,.rl.m1 i{background:#E8C873}.rbar .m2,.rl.m2 i{background:#8FA8E8}.rbar .m3,.rl.m3 i{background:#A48BE0}.rbar .m4,.rl.m4 i{background:#6DB48A}
.rleg{display:flex;flex-wrap:wrap;gap:4px 12px}
.rl{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}.rl i{width:9px;height:9px;border-radius:3px;display:block}
.rbody>.bigbtn{margin:14px 3px 0;width:calc(100% - 6px)}
.bigbtn.soft{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2.5px var(--line),0 4px 0 var(--line)}
.bigbtn.soft small{color:var(--muted)}
.rlist{display:flex;flex-direction:column;gap:8px;margin:0 3px}
.rlist .wordrow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;box-shadow:0 0 0 2px var(--tan);padding:10px 12px;border:none;margin:0}
.rlist .wj{font-size:22px;font-weight:800;min-width:72px;flex-shrink:0}
.rlist .wm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.rlist .wm b{font-size:15px;font-weight:800}.rlist .wm small{font-size:12.5px;color:var(--muted);font-weight:700}
.rlist .wnext,.rlist .due{font-size:12px;color:var(--muted);font-weight:600}
.rlist .due{color:var(--accent);font-weight:800}
.rlist .wm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.rlist .wj{font-size:19px;min-width:0}.rlist .wordrow{gap:10px;padding:9px 10px}.rlist .mchip{font-size:11px;padding:3px 8px}}
.lscene .helpbtn:disabled{background:rgba(255,251,239,.92);opacity:1;color:var(--faint)}.lscene .helpbtn:disabled *{opacity:.55}
.rempty{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;background:var(--surface);border-radius:22px;box-shadow:0 0 0 2px var(--tan);padding:22px 18px;margin:3px;font-size:14px;color:var(--muted)}.rempty b{font-size:16px;color:var(--ink)}
/* no mouse focus rings on tabs and buttons (keyboard still gets one) */
button:focus:not(:focus-visible){outline:none}
.nav button:focus-visible{outline:3px solid var(--accent);outline-offset:-6px;border-radius:14px}
/* ===== v4.1 Home life ===== */
#s-home .petzone{transform:translateX(calc(-50% + var(--px,0px)));transition:transform var(--wt,0ms) linear}
#s-home #pet{transform:scaleX(var(--face,1));transition:transform .18s ease}
#s-home .petzone.onright .bubble{left:auto;right:50%;margin-left:0;margin-right:-40px}
#s-home .petzone .shadow.sh-hop{animation:shhop .56s ease}
@keyframes shhop{0%,100%{transform:scale(1);opacity:1}35%{transform:scale(.62);opacity:.55}75%{transform:scale(1.12)}}
@keyframes hopSS{0%{transform:scale(1,1)}12%{transform:scale(1.12,.86)}32%{transform:translateY(-30px) scale(.9,1.12)}55%{transform:translateY(-32px) scale(.98,1.02)}80%{transform:translateY(0) scale(1.15,.84)}92%{transform:scale(.97,1.04)}100%{transform:scale(1,1)}}
#petBody.anim-hop{animation:hopSS .56s ease}
#petBody.anim-spin{animation:spinhop .8s ease}
#petBody.anim-squish{animation:squish .35s ease}
#petBody.walking{animation:walkbob .42s ease-in-out infinite}
#petBody.life-stretch{animation:lstretch 1.5s ease}
@keyframes lstretch{0%,100%{transform:scale(1,1)}25%,55%{transform:scale(.9,1.14) translateY(-2px)}75%{transform:scale(1.07,.93)}}
#petBody.life-sit{animation:lsit 2.8s ease}
@keyframes lsit{0%,100%{transform:scale(1,1)}15%,85%{transform:scale(1.06,.9)}50%{transform:scale(1.07,.89) rotate(-2deg)}}
#petBody.life-sniff{animation:lsniff 1.7s ease}
@keyframes lsniff{0%,100%{transform:none}20%,60%{transform:translateY(5px) rotate(5deg) scale(1.03,.95)}40%,80%{transform:translateY(3px) rotate(7deg) scale(1.02,.97)}}
#petBody.life-wiggle{animation:lwig 1s ease}
@keyframes lwig{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}35%{transform:rotate(8deg)}55%{transform:rotate(-7deg)}75%{transform:rotate(5deg)}}
#petBody.life-lookup{animation:llook 1.4s ease}
@keyframes llook{0%,100%{transform:none}25%,80%{transform:translateY(-4px) rotate(-6deg) scale(.97,1.05)}}
#petBody.life-doze{animation:ldoze 3.4s ease-in-out}
@keyframes ldoze{0%,100%{transform:none}20%,40%,60%,80%{transform:rotate(-3deg) scale(1.03,.95)}30%,50%,70%{transform:rotate(3deg) scale(1.03,.95)}}
#petBody.life-shiver{animation:lshiv .13s linear 10}
@keyframes lshiv{0%,100%{transform:translateX(0)}50%{transform:translateX(2.5px) scale(1.01,.99)}}
#petBody.life-chomp{animation:lchomp .25s ease-in-out 4}
@keyframes lchomp{0%,100%{transform:scale(1,1)}50%{transform:scale(1.09,.9)}}
#petBody.life-kick{animation:lkick .42s ease}
@keyframes lkick{0%,100%{transform:none}40%{transform:rotate(-10deg) translateX(-4px)}70%{transform:rotate(8deg) translateX(6px) scale(1.04,.96)}}
.pet-body.anim-idle.mood-happy{animation:bouncy 1.5s ease-in-out infinite}
@keyframes bouncy{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-9px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.05,.95)}}
.pet-body.anim-idle.mood-low{animation:droop 3.8s ease-in-out infinite}
@keyframes droop{0%,100%{transform:scale(1.02,.96)}50%{transform:scale(1.04,.93) translateY(1px)}}
.pet-body.anim-idle.mood-sleepy{animation:sleepy 4s ease-in-out infinite}
@keyframes sleepy{0%,100%{transform:rotate(-2deg) scale(1.02,.97)}50%{transform:rotate(2deg) scale(1.03,.95)}}
.flytreat{position:absolute;left:0;top:0;z-index:8;width:28px;height:28px;animation:flytreat .65s cubic-bezier(.3,.1,.5,1) forwards;pointer-events:none}
.flytreat .pix{width:28px;height:28px}
@keyframes flytreat{0%{transform:translate(var(--x0),var(--y0)) scale(.8)}50%{transform:translate(calc((var(--x0) + var(--x1))/2),calc(var(--y1) - 70px)) scale(1.2) rotate(180deg)}100%{transform:translate(var(--x1),var(--y1)) scale(.6) rotate(360deg);opacity:.7}}
.toyball{position:absolute;left:0;z-index:3;width:28px;height:28px;transform:translateX(var(--bx));pointer-events:none}
.toyball svg{width:28px;height:28px;display:block}
.toyball.fly{animation:ballfly var(--bt) linear forwards}
.toyball.fly svg{animation:ballarc var(--bt) ease-out}
@keyframes ballfly{to{transform:translateX(var(--bx)) rotate(540deg)}}
@keyframes ballarc{0%{transform:translateY(0)}35%{transform:translateY(calc(var(--bh) * -1))}70%{transform:translateY(0)}85%{transform:translateY(-14px)}100%{transform:translateY(0)}}
.toyball.pop{animation:ballout .4s forwards}
@keyframes ballout{to{opacity:0;transform:translateX(var(--bx)) scale(.4)}}
@media (prefers-reduced-motion: reduce){#s-home .petzone{transition:none}.pet-body.anim-idle.mood-happy,.pet-body.anim-idle.mood-sleepy{animation:bob 2.6s ease-in-out infinite}}
/* can't listen now */
.cantlisten{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto 4px;min-height:44px;padding:0 16px;border-radius:99px;font-size:14px;font-weight:800;color:var(--muted);background:var(--surface);box-shadow:0 0 0 2px var(--tan)}

/* ===== v4.1 Mythical ===== */
#s-home .petzone.mythic:before{content:"";position:absolute;left:50%;bottom:-4px;width:130%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,226,130,.85),rgba(185,130,255,.45) 55%,transparent 74%);animation:mythglow 3.2s ease-in-out infinite;z-index:-1;pointer-events:none}
@keyframes mythglow{0%,100%{opacity:.7;transform:translateX(-50%) scale(.96)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
#s-home .petzone.mythic:after{content:"✦ ✧ ✦";position:absolute;left:50%;top:-6px;transform:translateX(-50%);color:#F6CB4E;font-size:14px;letter-spacing:18px;text-shadow:0 0 6px #fff;animation:mythtw 2.4s ease-in-out infinite;pointer-events:none;white-space:nowrap}

.mythart{position:relative;display:grid;place-items:center;margin:6px auto 2px;width:220px;height:200px}
.mythart .mray{position:absolute;inset:-20px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(246,203,78,.55) 0 10deg,transparent 10deg 24deg);animation:mspin 9s linear infinite;mask:radial-gradient(closest-side,#000 40%,transparent 75%);-webkit-mask:radial-gradient(closest-side,#000 40%,transparent 75%)}
@keyframes mspin{to{transform:rotate(360deg)}}
.mythart .gart{position:relative;max-height:170px;max-width:200px;filter:drop-shadow(0 0 12px rgba(255,220,120,.9));animation:mpop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes mpop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.mythart .mkana{position:absolute;bottom:-6px;font-size:15px;font-weight:900;color:#9B4FD8;background:#FFF8E8;border-radius:99px;padding:2px 12px;box-shadow:0 0 0 2px #E2A31F}
.gacha.mythwin .gresult{background:radial-gradient(circle at 50% 30%,#FFF6DA,#F3E6FF 70%);box-shadow:0 0 0 3px #E2A31F,0 0 28px rgba(155,79,216,.45)}
.bigbtn.mythbtn{background:linear-gradient(90deg,#9B4FD8,#C4566F 60%,#E2A31F);color:#fff}
.mythh{background:linear-gradient(90deg,#9B4FD8,#E2A31F);-webkit-background-clip:text;background-clip:text;color:transparent}
.myrow .co-p{box-shadow:0 0 0 3px #E2A31F,0 3px 0 #B57C12;background:radial-gradient(circle at 50% 70%,#FFF4CF,#EADCFF 75%)}
.myrow .co-f.cur .co-p{box-shadow:0 0 0 3px #9B4FD8,0 0 12px rgba(155,79,216,.6)}
.myrow .co-f.locked .co-p{box-shadow:0 0 0 2px #CDB98F;background:#EFE6F7}
.myrow .co-f.locked img{filter:brightness(0) opacity(.22)}

#petName.mythname{background:linear-gradient(90deg,#B07AE8,#E2A31F 55%,#C4566F);-webkit-background-clip:text;background-clip:text;color:transparent}

.sttr{font:inherit;font-size:12px;font-weight:800;border:0;border-radius:99px;padding:5px 10px;background:var(--card2,#fff3dc);color:inherit;cursor:pointer}
.stl{display:flex;align-items:flex-end;gap:8px;animation:pop .25s ease}.stl.me{flex-direction:row-reverse}
.stav{width:42px;height:42px;object-fit:contain;flex:none}.stav.sm{width:28px;height:28px;vertical-align:middle;margin-right:6px}
.stb{max-width:74%;background:#fff;border-radius:16px 16px 16px 4px;padding:7px 11px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 0 0 1.5px rgba(43,33,29,.12)}
.stl.me .stb{border-radius:16px 16px 4px 16px;background:#FDEBEF}
.stn{display:block;font-size:11px;font-weight:800;opacity:.6}.stj{font-size:16px;font-weight:700;line-height:1.5}
.stt{display:none;font-size:12px;opacity:.75;margin-top:2px}.story.showtr .stt{display:block}
.speak.sm{position:static;width:30px;height:30px;flex:none;margin:0}.rjl{display:block;font-size:11px;font-weight:700;color:var(--accent);opacity:.85;letter-spacing:.01em}.speak.sm svg{width:16px;height:16px}
.gnote{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 0 0 2.5px var(--ink,#2B211D)}
.gn-k{display:inline-block;font-size:11px;font-weight:900;background:var(--accent);color:#fff;border-radius:99px;padding:2px 9px}
.gn-p{font-size:24px;font-weight:800;margin:6px 0 0}.gn-t{font-size:14px;font-weight:800;opacity:.7}.gn-r{font-size:14px;line-height:1.5;margin:8px 0}
.gn-f{display:grid;grid-template-columns:auto auto 1fr;gap:3px 10px;font-size:16px;font-weight:800;margin:4px 0 8px}.gn-f i{font-style:normal;color:var(--accent)}
.gn-x{display:flex;align-items:center;gap:8px;justify-content:space-between;background:#FBF3E4;border-radius:12px;padding:7px 10px;margin-top:6px}
.gn-xj{font-size:15px;font-weight:800}.gn-x small{font-size:12px;opacity:.75}
.wch{display:block;font-style:normal;font-size:9.5px;font-weight:900;opacity:.6;letter-spacing:.03em}
.jch{background:var(--ink,#2B211D);color:#FFF6E0}
.jskip{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;font:inherit;border:0;border-radius:16px;padding:10px 14px;margin-top:10px;background:#FFF1CF;box-shadow:0 0 0 2px #E9C870;color:#6A4A12;cursor:pointer}
.opt.talkopt{flex-direction:column;align-items:flex-start;text-align:left;gap:2px}.opt.talkopt span{font-size:17px;font-weight:800}.opt.talkopt small{margin:0}
.jskip b{font-size:14px}.jskip small{font-size:12px;font-weight:700;opacity:.85}
.sqcard{display:flex;align-items:center;gap:10px;justify-content:center}
.jbook svg{width:18px;height:18px}
.gbmodal{max-height:86vh;overflow:auto;text-align:left}.gbmodal .gnote{margin:0 0 12px;box-shadow:0 0 0 2px rgba(43,33,29,.15)}
.gb-sub{margin:-4px 0 8px;font-size:13px;opacity:.75}.gbook{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.gb-h{display:flex;align-items:center;gap:6px;margin:10px 0 2px;font-size:14px}
.gb-row{display:flex;flex-direction:column;align-items:flex-start;gap:1px;font:inherit;text-align:left;border:0;border-radius:12px;padding:8px 12px;background:#FBF3E4;color:inherit;cursor:pointer}
.gb-row.locked{opacity:.45;cursor:default}.gb-p{font-size:16px;font-weight:800}.gb-row small{font-size:12px;opacity:.75}
.gcard{background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:12px;box-shadow:0 0 0 2px rgba(43,33,29,.1)}.gcard .bigbtn{margin:8px 0 4px}.gcard .link{display:block;margin:4px auto 0}
.gc-empty{display:block;font-size:13px;opacity:.75;margin:6px 0}
.talkin .link{display:block;margin:8px auto 0}
.placecard{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;font:inherit;border:0;border-radius:16px;padding:11px 14px;margin-top:10px;background:#E8F2FB;box-shadow:0 0 0 2px #9CC3E6;color:#20476B;cursor:pointer}
.placecard b{font-size:14.5px}.placecard small{font-size:12px;font-weight:700;opacity:.85}.placecard.compact{margin:8px 0 0}
.placetag{font-size:11.5px;font-weight:800;color:#20476B;background:#E8F2FB;border-radius:99px;padding:3px 10px;align-self:flex-start;display:inline-block;margin-bottom:6px}
.idk{display:block;margin:12px auto 0}
.savemenu .bigbtn{margin:6px 0}.savesum{display:flex;flex-direction:column;gap:1px;background:#FBF3E4;border-radius:14px;padding:9px 12px;margin:4px 0 8px;text-align:left}
.savesum b{font-size:14px}.savesum small{font-size:12px;opacity:.8}.saverow{display:flex;justify-content:center;gap:14px;margin:4px 0}
.savecode{width:100%;box-sizing:border-box;font:12px/1.4 ui-monospace,monospace;border-radius:12px;border:2px solid var(--line,#e6d7bd);padding:8px;margin:6px 0 10px;resize:vertical;word-break:break-all}
.fbchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.fbchip{font:inherit;font-size:13px;font-weight:800;border:0;border-radius:99px;padding:6px 12px;background:#FBF3E4;color:inherit;cursor:pointer;box-shadow:inset 0 0 0 2px #E9D9B6}
.fbchip[aria-pressed=true]{background:var(--accent);color:#fff;box-shadow:none}
.fbstars{display:flex;gap:4px;justify-content:center;margin:2px 0 6px}.fbstars button{font-size:28px;line-height:1;border:0;background:none;color:#E2D3B5;cursor:pointer;padding:2px}.fbstars button.on{color:#F2B33D}
.fbtext{width:100%;box-sizing:border-box;font:inherit;font-size:14px;border-radius:12px;border:2px solid var(--line,#e6d7bd);padding:9px 11px;resize:vertical;margin-bottom:6px}
.fbinc{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;opacity:.85;margin:2px 0 8px;text-align:left}.fbinc input{width:18px;height:18px;accent-color:var(--accent)}
.fbtr{display:flex;flex-direction:column;gap:2px;text-align:left;background:#EAF4EC;border-radius:12px;padding:8px 11px;margin:0 0 8px}.fbtr b{font-size:12px}.fbtr small{font-size:13px;line-height:1.4}
.vreport{margin-left:auto;flex:none;font:inherit;font-size:11.5px;font-weight:800;border:0;border-radius:99px;padding:4px 10px;background:rgba(255,255,255,.7);color:inherit;opacity:.8;cursor:pointer}
.evmodal{text-align:left}.evhead{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px 14px;margin-bottom:8px;box-shadow:inset 0 0 0 2px rgba(43,33,29,.08)}
.evhead .hci{width:44px;height:44px;flex:none;overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.7);border-radius:14px}.evhead .hci>*{width:30px!important;height:30px!important}.evhead small{display:block;font-size:11px;font-weight:900;opacity:.6;text-transform:uppercase;letter-spacing:.05em}.evhead b{font-size:20px}
.evend{display:block;font-size:12px;font-weight:700;opacity:.7}
.evcard{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;font:inherit;border:0;border-radius:16px;padding:11px 14px;margin:8px 0 0;background:#fff;box-shadow:0 0 0 2px rgba(43,33,29,.12);color:inherit;cursor:pointer}
.evcard b{font-size:15px}.evcard small{font-size:12.5px;opacity:.8}
.evk{align-self:flex-start;font-size:10.5px;font-weight:900;border-radius:99px;padding:2px 9px;background:var(--accent);color:#fff}.evk.gold{background:#E2A31F}
.evfeat{display:flex;gap:6px;margin-top:6px}.evf{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:#FBF3E4;border-radius:12px;padding:6px 2px}.evf img{width:42px;height:42px;object-fit:contain}.evf small{font-size:10.5px;font-weight:800}.evf.own{opacity:.55}
.evbanner{display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(255,255,255,.85);border-radius:14px;padding:6px 12px;margin:0 auto 6px;max-width:340px;text-align:center;box-shadow:0 0 0 2px rgba(226,163,31,.5)}.evbanner b{font-size:14px}.evbanner span{font-size:11.5px;font-weight:700;opacity:.8}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- HOME -->
  <section class="screen" id="s-home">
    <div class="hscroll">
      <div class="stage" id="stage" role="button" aria-label="Tap to play with your companion">
        <div class="particles"><span style="left:14%;top:28%;animation-delay:0s"></span><span style="left:80%;top:22%;animation-delay:1.5s"></span><span style="left:26%;top:60%;animation-delay:3s"></span><span style="left:70%;top:52%;animation-delay:4.5s"></span><span style="left:50%;top:14%;animation-delay:2s"></span><span style="left:88%;top:70%;animation-delay:6s"></span></div>
        <div class="hud">
          <button class="idcard" id="scName" aria-label="About your companion"><span class="nm"><span id="nameTap" role="button" aria-label="Hear name"><span id="petName">Mystery egg</span><svg class="i spk" id="nameSpk" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></span></span><span class="xpbar"><i id="growBar"></i></span><span class="xpmeta"><span class="stagechip" id="stageChip">Egg</span><span class="mooddot">·</span><span id="growN"></span><span class="mooddot md2">·</span><span id="moodChip">ごきげん</span></span><span class="sr" id="petSub"></span><span class="sr" id="growHint"></span></button>
          <span class="hud-r"><span class="hud-stats"><span class="pill streak" title="Day streak"><svg class="i" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg><b id="streak">0</b></span>
          <button class="pill" id="coinBtn" aria-label="Coins and style shop"><svg class="i" viewBox="0 0 24 24" style="color:#E2A31F"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.5 9.5h3.8a1.7 1.7 0 0 1 0 3.4h-2.6a1.7 1.7 0 0 0 0 3.4h3.8"/></svg><b id="coins">0</b></button>
          </span><button class="iconbtn" id="menuBtn" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></span>
        </div>
        <div class="greet sr"><div class="g-en" id="gEn">Good morning</div><div class="g-jp" id="gJp" lang="ja">おはよう</div></div>
        <button class="capbtn" id="spotGacha" aria-label="Capsule machine"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><circle cx="12" cy="12" r="2.2"/></svg><span class="badge hidden" id="gachaBadge"></span></button><button class="emobtn" id="emoBtn" aria-label="Stickers"><svg class="stkico" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 6h24a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6H18l-7 6 1-6H8a6 6 0 0 1-6-6V12a6 6 0 0 1 6-6z" fill="#fff" stroke="#3A2622" stroke-width="2.6" stroke-linejoin="round"/><path d="M20 26c-6-4-9-7-9-10.2C11 13 13 11.5 15.2 11.5c2 0 3.4 1.2 4.8 3 1.4-1.8 2.8-3 4.8-3C27 11.5 29 13 29 15.8 29 19 26 22 20 26z" fill="#F4828F" stroke="#3A2622" stroke-width="2.2" stroke-linejoin="round"/><path d="M14.5 14.6c.6-.9 1.6-1.3 2.5-1.1" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></button>
        <div class="petzone" id="petzone"><div class="pet-wrap" id="petWrap"><div class="bubble hidden" id="bubble"></div><span class="aura hidden" id="aura"></span><span class="hatchring hidden" id="hatchRing"></span><span class="hatchtap hidden" id="hatchTap"><b>👆</b><i>Tap!</i></span><div class="pet-body" id="petBody"><img class="pet" id="pet" alt=""><span class="acc hidden" id="acc"></span><img class="acc-over hidden" id="accOver" alt=""></div><span class="zzz hidden" id="zzz">z z</span></div><div class="shadow"></div></div>
        <div class="taphint" id="tapHint">Tap to play</div>
        <div class="actions dock">
        <button class="act" id="spotFeed"><span class="ai"><svg class="stk" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 7.5c5.5 0 16.5 18 16.5 25 0 6-6 8.5-16.5 8.5S7.5 38.5 7.5 32.5c0-7 11-25 16.5-25z" fill="#FFFFFF" stroke="#2B211D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 29.5h14v11.4c-2.2.1-4.5.1-7 .1s-4.8 0-7-.1z" fill="#2B211D" stroke="#2B211D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17c1.5-3 3.5-5.5 5.5-6" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Feed</button>
        <button class="act" id="spotPlay"><span class="ai"><svg class="stk" viewBox="0 0 48 48" aria-hidden="true"><path d="M14 15h20c6 0 10 5 10 12.5 0 6-2.6 9.5-6 9.5-3 0-4.5-2.5-6.5-5h-15c-2 2.5-3.5 5-6.5 5-3.4 0-6-3.5-6-9.5C4 20 8 15 14 15z" fill="#F2A9C9" stroke="#2B211D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 21.5v8M10 25.5h8" fill="none" stroke="#2B211D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="22.5" r="2.4" fill="#FFFFFF" stroke="#2B211D" stroke-width="2"/><circle cx="36.5" cy="27.5" r="2.4" fill="#F6CB6E" stroke="#2B211D" stroke-width="2"/></svg></span>Play</button>
        <button class="act" id="spotRest"><span class="ai"><svg class="stk" viewBox="0 0 48 48" aria-hidden="true"><path d="M27 7.5A17 17 0 1 0 41.5 31 13.5 13.5 0 1 1 27 7.5z" fill="#F6CB6E" stroke="#2B211D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 7l1.4 3.3 3.3 1.4-3.3 1.4L38 16.4l-1.4-3.3-3.3-1.4 3.3-1.4z" fill="#FFFFFF" stroke="#2B211D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="restLabel">Rest</span></button>
        <button class="act" id="spotDress"><span class="ai"><svg class="stk" viewBox="0 0 48 48" aria-hidden="true"><path d="M22 26.5l-6 12 4.2-1.2 2.3 3.7 3-13z" fill="#C4566F" stroke="#2B211D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 26.5l6 12-4.2-1.2-2.3 3.7-3-13z" fill="#C4566F" stroke="#2B211D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 23c-5-9-15.5-11-16.5-4.5S12 31 24 25z" fill="#E37A93" stroke="#2B211D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 23c5-9 15.5-11 16.5-4.5S36 31 24 25z" fill="#E37A93" stroke="#2B211D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="24" r="4" fill="#C4566F" stroke="#2B211D" stroke-width="3"/></svg></span>Style</button>
        </div>
      </div>
      <div class="continue" id="contCard">
        <div class="c-l"><div class="c-k" id="contKicker">Next · Sakura Village</div><div class="c-t" id="contTitle">Lesson 1 · Hello!</div>
          <button class="goalrow" id="emaBtn" aria-label="Today's goals"><span class="dots" id="goalDots"><i></i><i></i><i></i></span><span class="c-m" id="contMeta">Goals 0/3 · +15 XP</span><span class="sr" id="goalsSub"></span></button></div>
        <button class="c-go" id="startBtn" aria-label="Start lesson"><svg class="i" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="none"/></svg></button>
      </div>
      <div id="placeSlot"></div>
      <div class="chiprow">
        <button class="hchip" id="scrollWord"><span class="hci" style="color:#A4425A"><svg class="i" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/></svg></span><span class="hct"><small>Word of the day</small><b class="wotd-jp" id="wordV" lang="ja">ことば</b><span class="sr" id="wordEn"></span></span></button>
        <button class="hchip seasoncard hidden" id="seasonCard"><span class="hci" id="seasonIco"></span><span class="hct"><small>Event</small><b id="seasonName"></b><span class="sr" id="seasonTip"></span></span></button>
      </div>
    </div>
  </section>

  <!-- JOURNEY -->
  <section class="screen hidden" id="s-journey">
    <div class="jhead"><div class="jh-t"><b>Journey</b><span lang="ja">たび</span></div><button class="jinfo jbook" id="jBook" aria-label="Grammar book"><svg class="i" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 7.5h8M8 11h6"/></svg></button><button class="jinfo" id="jInfo" aria-label="How the Journey works">?</button><span class="coinpill"><svg class="i" viewBox="0 0 24 24" style="color:#E2A31F;width:17px;height:17px"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.5 9.5h3.8a1.7 1.7 0 0 1 0 3.4h-2.6a1.7 1.7 0 0 0 0 3.4h3.8"/></svg><span id="coins2">0</span></span></div>
    <div class="wchips" id="wchips"></div>
    <div class="scroll"><div id="worlds"></div></div>
  </section>

  <!-- REVIEW -->
  <section class="screen hidden" id="s-review">
    <div class="jhead"><div class="jh-t"><b>Review</b><span lang="ja">ふくしゅう</span></div><button class="jinfo" id="rInfo" aria-label="How review works">?</button></div>
    <div class="scroll rbody" id="reviewBody"></div>
  </section>

  <!-- COLLECTION -->
  <section class="screen hidden" id="s-collection">
    <div class="cohero" id="coHero"></div>
    <div class="scroll cobody" id="collectionBody"></div>
  </section>

  <!-- LESSON -->

    <div class="lessontop"><button class="x" id="quitLesson" aria-label="Quit lesson"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="lprog"><i id="lprog"></i></div><button class="helpbtn" id="helpBtn" aria-label="Ask your Mojimo for help"><span class="hpic"></span>Help <b id="helpN">1</b></button></div>

    <div class="buddy" id="buddy"><img class="bpet" id="lessonPet" alt=""><div class="bbub hidden" id="bbub"></div></div>
    <div class="combo" id="combo"></div>
    </div>
    <div class="ex" id="ex"></div>
    <div class="footer" id="footer"><div class="verdict hidden" id="verdict"></div><button class="bigbtn" id="checkBtn" disabled>Check</button></div>

  <!-- RESULTS -->
  <section class="screen hidden" id="s-results">
    <div class="results">
      <h2 id="resTitle">Lesson complete!</h2>
      <div class="xplines" id="resLines"></div>
      <div class="ring">
        <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="#EADFC6" stroke-width="12"/><circle id="ringArc" cx="100" cy="100" r="88" fill="none" stroke="#B94E68" stroke-width="12" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="553"/></svg>

        <div class="reward"><b id="rTreat">🍡</b><small id="rTreatName">treat</small></div>

      <div class="masterylist" id="masteryList"></div>
      <button class="bigbtn" id="resContinue">Continue</button>
    </div>
  </section>

！ でも、おそく こないでね。","Yes, we'll sing! But don't come late.","Ya, menyanyi! Tapi jangan datang terlambat, ya."],["U","うん、はやく いく！","OK, I'll go early!","Oke, saya datang lebih awal!"]],"q":[2,6]},"c9":{"t":["A day at the castle","おしろの いちにち","Sehari di istana"],"lines":[["U","きのう、おしろに いった。","Yesterday I went to the castle.","Kemarin saya pergi ke istana."],["N","いいね！ なにを した？","Nice! What did you do?","Asyik! Ngapain saja?"],["U","きものを きた。それから、おちゃを のんだ。","I wore a kimono. Then I drank tea.","Saya memakai kimono. Lalu saya minum teh."],["N","おしろの しゃしんは もう とった？","Have you taken photos of the castle yet?","Sudah memotret istananya?"],["U","ううん、まだ とって いない。あしたも いくから。","No, not yet. Because I'm going again tomorrow.","Belum. Soalnya besok saya ke sana lagi."],["N","じゃあ、わたしも いく！ おしろが すきだから。","Then I'm coming too! Because I love castles.","Kalau begitu saya ikut! Soalnya saya suka istana."],["U","うん、いっしょに いきましょう！","Yes, let's go together!","Ya, ayo pergi bersama!"]],"q":[2,4]},"c10":{"t":["Holiday plans","やすみの よてい","Rencana liburan"],"lines":[["N","なつやすみは なにを する つもり？","What are you planning to do in the summer vacation?","Liburan musim panas mau apa?"],["U","とうきょうに いく つもり。","I'm planning to go to Tokyo.","Saya berencana pergi ke Tokyo."],["N","とうきょうと おおさかと、どちらが すき？","Which do you like better, Tokyo or Osaka?","Kamu lebih suka Tokyo atau Osaka?"],["U","おおさかの ほうが すき。たべものが いちばん おいしいから。","I like Osaka more. Because the food is the best.","Saya lebih suka Osaka. Soalnya makanannya paling enak."],["N","じゃあ、どうして とうきょうに いくの？","Then why are you going to Tokyo?","Lalu kenapa pergi ke Tokyo?"],["U","にほんごが じょうずに なりたいから！","Because I want to get good at Japanese!","Soalnya saya ingin pandai bahasa Jepang!"],["N","きっと じょうずに なるよ！","You'll definitely get good!","Pasti kamu jadi pandai!"]],"q":[0,3]},"c11":{"t":["Back from Tokyo","とうきょうから かえって","Pulang dari Tokyo"],"lines":[["N","おかえり！ とうきょうは どうだった？","Welcome back! How was Tokyo?","Selamat datang kembali! Bagaimana Tokyo?"],["U","ただいま！ かいものを したり、すし
